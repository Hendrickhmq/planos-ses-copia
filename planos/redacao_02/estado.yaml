heranca:
  instrumento: "convenio, nao MROSC. Art. 199 §1º CF + art. 24 § unico da Lei 8.080/90"
  camada_distrital: "Decreto DF 48.727/2026. O 37.843/2016 esta fora (e MROSC)"
  fonte: "Incremento MAC (art. 24 da Portaria GM/MS 10.297/2026). FAEC nao paga;
    o PMAE e base; APAC e comprovacao"
  planilha: "de baixo para cima pelo fluxo do atendimento; tecnico / administrativo
    / financeiro; rubrica no fim"
  detalhe: "redacao/estado.yaml — nao reabrir sem ordem expressa"

# ---------------------------------------------------------------------------
# RODADA 0 — as tres travas. Fechada em 2026-08-24 com respostas do usuario.
# ---------------------------------------------------------------------------
travas:
  T1_instrumento:
    status: fechada
    emenda: "INDIVIDUAL, federal — logo a espinha federal e a Portaria GM/MS
      10.297/2026 (RP 6). A 10.352/2026 (coletivas, RP 7 e RP 8) sai da base legal."
    decorrencias: "art. 24 (InvestSUS / Incremento MAC); art. 27, II, IV e §3º;
      art. 32 (funcional 10.302.5118.2E90, GND 3, modalidade 31, ate seis parcelas);
      art. 6º, II (coerencia com Plano de Saude e PAS como elegibilidade)."
  T2_elegibilidade:
    status: parcial
    par: "usuario: 'acredito que sim'. Entra como PREMISSA DECLARADA, nao como fato.
      Lacuna L-001, dono SES-DF."
    habilitacao_38_01: "usuario: 'nao sei te dizer'. Mantida a leitura conservadora —
      o plano exige PAR e 38.01. Lacuna L-002."
    complementaridade: "usuario: havendo fila e demanda, o caminho e a complementariedade
      por instituicao sem fins lucrativos. E o EIXO DO ARGUMENTO do art. 24 da Lei
      8.080/90 — mas o numero do deficit da rede propria continua ausente (L-004),
      e sem ele a justificativa demonstra NECESSIDADE, nao COMPLEMENTARIDADE."
    pds_pas: "NAO respondido. Continua aberto e e elegibilidade, nao merito. L-003."
  T3_dinheiro:
    status: fechada_no_essencial
    custo_unitario: "R$ 200,00 COBREM o custo assistencial da OCI no DF — informado
      pelo usuario em 24/08/2026. ENCERRA a antiga LC-025, que era a pendencia numero
      um do plano anterior e o risco R-05."
    decorrencia: "o setor tecnico esta dentro do valor unitario e NAO se repete na
      planilha de apoio. Producao = 35.000 x R$ 200,00 = R$ 7.000.000,00, exequivel."
    divisao_70_30: "ADIADA por decisao do usuario ('podemos decidir depois, nao e um
      problema'). Regra de trabalho ate la: o apoio se monta pelo fluxo e o total da o
      que der; so entao se compara com os R$ 3.000.000,00. Nenhuma linha e esticada
      para fechar o envelope. Decisao vence ao fim da rodada 7 — L-005."

regra_de_citacao_normativa:
  usuario_2026_08_24: "Para citar uma norma precisa ter um motivo, nao apenas citar
    por citar. Nem ajudam nem prejudicam, tem que ver se sao necessarias."
  aplicacao: "00_metodo.md, secao 'O teste da norma citada'. Encerra a duvida P4 da
    folha da aula: as 29 normas do plano anterior nao contam a favor nem contra — cada
    uma responde 'o que muda no plano se ela sair?' ou e cortada."

rodada_01_objeto:
  arquivo: "redacao_02/secoes/01_objeto.md"
  decisoes_do_usuario_2026_08_24:
    territorio: "O DF tem 7 Regioes de Saude; os polos ocupam 3 delas."
    unidade: "OCI CONCLUIDA. Razao dada pelo usuario: a consulta de retorno e o que
      retira o paciente da fila ou o encaminha para outra fila/procedimento."
    teto: "R$ 10.000.000,00."
  referencia: "DISTRITAL — confirmado pelo usuario em 24/08/2026: 'o convenio atende
    todos do DF'. A localizacao do polo e decisao de acesso, nao recorte de populacao."
  polos: "Sobradinho (Norte), Gama (Sul) e SAMAMBAIA (Sudoeste). Samambaia substituiu
    Ceilandia em 24/08/2026, depois do painel de lista de espera: o arco oeste tem
    10.897 solicitacoes e 9.192 delas estao no Sudoeste, enquanto Ceilandia esta na
    regiao de 1.705, na borda. Taguatinga descartada por ser onde a rede propria e
    mais forte — polo sobre capacidade instalada enfraquece a complementaridade."
  vazio_declarado: "Central 5.902 + Leste 3.465 = 9.367 solicitacoes (23% da fila)
    sem polo. Deliberado, pela mesma razao. Vai escrito na rodada 12 e volta como
    risco de acesso na rodada 11."
  fila: "Painel de lista de espera, dados/fila_espera.md. Fila viva 40.829
    solicitacoes / 37.731 CNS; devolvidas FORA do total; espera media 851,40 dias;
    filtro de 13 procedimentos cardiologicos para adultos. Base do dimensionamento
    e o CNS: 35.000 OCI = 92,8% de 37.731. Falta URL e data de referencia (L-011)."
  correcao_do_plano_anterior: "O objeto anterior citava 4 regioes de origem
    (Norte/Sul/Oeste/Sudoeste) e a metodologia falava em 7 e punha um polo atendendo
    Norte e Leste. Separar 'onde o polo fica' de 'de onde o usuario vem' desfaz a
    contradicao."
  normas_citadas: "3 — SAES 1.822/2024 (codigo), NT 1/2025-DAET + SAES 2.930/2025
    (composicao). Todas pelo motivo 'define dado que o plano usa'."

rodada_02_metas:
  arquivo: "redacao_02/secoes/02_metas.md"
  decisoes_2026_08_24:
    divisao: "IGUAL — 11.667 / 11.667 / 11.666. Razao: capacidade instalada identica
      nos tres polos; meta desigual exigiria polo desigual (equipe, estrutura, custo)."
    curva: "polos abertos nas 2 primeiras semanas do mes 1; entradas do mes 1 ao 9;
      conclusoes do mes 2 ao 10."
    corte: "a meta de 87.500 horarios ofertados foi CORTADA. Nao era promessa, era
      dimensionamento — passa a nascer do fluxo, na rodada 4."
  meta_qualitativa: "DECIDIDA — apenas a opcao A: desfecho clinico em campo estruturado
    + contrarreferencia a Atencao Primaria, 100% das OCI concluidas, apuracao mensal.
    Resolutividade e satisfacao DESCARTADAS, com a razao escrita no proprio documento
    (secao 6.3), por pedido expresso do usuario em 24/08/2026. Satisfacao nao volta como
    indicador na rodada 3."
  achados_gerados: "AC-047 (os 4 aprovados usam o MESMO indicador qualitativo, palavra
    por palavra, e ele descreve condicao de existencia da OCI) e AC-048 ('satisfacao'
    aparece zero vezes no texto corrido dos 4; existe so no pt_ses_01 como item de
    despesa de R$ 30.000 sem meta, indicador, parametro, amostra ou consequencia)."
  duvida_ao_professor: "DV-050 em redacao_02/duvidas_professor.md — o que a SES-DF de
    fato aceita como meta qualitativa. Se a resposta contrariar a escolha, a Meta 3 se reve."

rodada_03_indicadores:
  arquivo: "redacao_02/secoes/03_indicadores.md"
  conjunto: "SEIS indicadores, contra 20 do plano anterior. IND-01 producao da
    competencia; IND-02 acumulada; IND-03 polos aptos 3/3; IND-04 desfecho; IND-05
    contrarreferencia; IND-06 nao comparecimento separado entre entrada e retorno."
  cortados_pelo_usuario: "IND-07 (abandono do ciclo) e IND-08 (APAC rejeitada). O 07
    era quase redundante com o 06. O 08 nao deixa buraco na afericao porque a
    apresentacao ja e condicao de conclusao — perde-se a CAUSA, mitigada pela
    obrigacao de apresentar producao apresentada e aprovada lado a lado (7.3)."
  limiares: "NAO HA limiar percentual de tolerancia na producao, e isso virou POSICAO
    DECLARADA com dispositivo: art. 27 § unico (analise observa a proporcionalidade da
    aplicacao dos recursos e os resultados alcancados) e art. 25 (gradua saneamento,
    glosa, suspensao, reprogramacao, rescisao CONFORME A GRAVIDADE) do Decreto
    48.727/2026. A afericao da producao e linear: cada OCI concluida e aprovada vale
    R$ 200,00 e o que nao foi entregue nao e devido. Onde o cumprimento e BINARIO
    (IND-03, IND-04, IND-05) o parametro e 100% como conformidade, nao tolerancia.
    ISSO DESEMPATA o unico ponto em que o plano anterior empatou com o corpus."
  numerador: "producao APROVADA, nao apresentada — decisao do usuario. A diferenca
    entre as duas e apresentada como informacao de gestao, sem virar indicador."
  pergunta_aberta_mais_cara: "A proporcionalidade resolve a producao e NAO resolve o
    apoio. Os R$ 3.000.000,00 nao sao pagos por unidade: se a execucao entregar 80%
    das OCI, o executor fica com 100% do apoio? L-016, vence nas rodadas 7 e 8."

rodada_04_fluxo:
  arquivo: "redacao_02/secoes/04_fluxo.md"
  decisoes_2026_08_24:
    ciclo: "DOIS contatos — entrada presencial em DIA UNICO (consulta + ECG + exames
      secundarios + laudo) e retorno por TELECONSULTA. Retorno presencial permanece
      disponivel para quem nao tiver dispositivo, conexao ou autonomia."
    apac: "aberta pelo POLO / profissional — PREMISSA adotada, o usuario vai confirmar
      com o professor. DV-051."
    busca_ativa: "WhatsApp, telefone e mensagem. Prova e o REAGENDAMENTO no SISREG,
      nao a ligacao anotada."
    absenteismo: "20% em CADA um dos dois pontos, fornecido pelo usuario como valor a
      utilizar; ele declarou NAO ter a taxa real da SES-DF. Premissa declarada, com o
      IND-06 corrigindo desde a primeira competencia."
  dimensionamento: "35.000 / 0,80 = 43.750 horarios de entrada; 35.000 / 0,80 = 43.750
    de retorno; TOTAL 87.500. E dimensionamento de agenda, NAO meta."
  coincidencia_com_o_plano_anterior: "87.500 e exatamente o numero do plano anterior,
    que la aparecia como 'fator 1,25 em dois pontos', afirmado sem base. 1,25 = 1/0,80.
    O numero e o mesmo; o ESTATUTO nao — agora e premissa declarada e corrigivel."
  achado_da_rodada: "A FILA QUASE NAO TEM FOLGA. 35.000 sobre 37.731 pessoas deixa
    margem de 2.731 (7,2%). A conta de 43.750 horarios pressupoe que o faltoso e
    reagendado e ACABA comparecendo; se mais de 7,2% dos encaminhados nunca converterem,
    a fila atual nao comporta 35.000 OCI concluidas. O que salva e o reabastecimento da
    fila ao longo dos 10 meses — raciocinio, nao dado. L-017."
  proteccao_de_dados: "Escrita DENTRO da secao 5, junto da busca ativa, que e onde o
    dado pessoal circula fora dos sistemas oficiais. Nao ha capitulo apartado."
  qualidade_assistencial: "ADIADA — depende do protocolo clinico, que e lacuna do
    responsavel tecnico. Nao foi escrita nesta rodada; entra em passagem posterior na
    secao 5."

rodada_05_etapas:
  arquivo: "redacao_02/secoes/05_etapas.md"
  etapas: "TRES. 1 Implantacao (6 subetapas, 2 primeiras semanas do mes 1, entrega =
    3 polos aptos); 2 Execucao assistencial (6 subetapas, mes 1 2a quinzena ao mes 10,
    entrega = 35.000 OCI concluidas); 3 Encerramento e conciliacao (3 subetapas, mes 10
    ao fim da vigencia financeira). Etapas 2 e 3 SE SOBREPOEM no mes 10."
  curva: "Entradas efetivas m1..m9: 1.500 / 3.000 / 4.000 / 4.500 x5 / 4.000 = 35.000.
    Horarios de entrada = /0,80 = 43.750. Conclusoes m2..m10, mesma serie deslocada um
    mes = 35.000. Horarios de retorno = 43.750. AS ENTRADAS TERMINAM NO MES 9 — entrada
    no mes 10 nao teria competencia seguinte dentro da vigencia."
  denominador_do_IND01: "a coluna OCI concluidas desta curva. Existe aqui e em nenhum
    outro lugar do plano."
  achado_da_rodada: "89 ENTRADAS COMPLETAS POR POLO POR DIA UTIL no regime pleno (meses
    4 a 8): 5.625 horarios de entrada/mes / 3 polos = 1.875, / 21 dias uteis = 89,3.
    Cada uma com consulta + ECG + minimo 2 exames + laudo NO MESMO DIA. Vem de comprimir
    43.750 horarios em 8,5 meses e 3 polos. E o numero que a rodada 6 tem de sustentar;
    se nao couber, o ajuste e em numero de polos, vigencia ou quantitativo — nao no
    cronograma."
  premissas_minhas: "conclusao na competencia SEGUINTE a da entrada (conservadora);
    rampa de tres meses ate o regime pleno; 21 dias uteis/mes. Todas declaradas no
    documento ou no fechamento."

rodada_06_equipe:
  arquivo: "redacao_02/secoes/06_equipe.md"
  correcao_normativa: "COMPOSICAO DA OCI CORRIGIDA EM SECOES JA APROVADAS. Nao e 'no
    minimo dois secundarios indicados clinicamente' — sao OBRIGATORIOS E NOMINADOS.
    Portaria SAES/MS 1.822/2024 descreve o conjunto (consulta, ECOCARDIOGRAMA, ECG,
    radiografia de torax, laboratoriais, retorno); Portaria SAES/MS 2.930/2025 art. 1º
    EXCLUI 02.04.03.015-3 radiografia de torax (PA e perfil); Portaria SAES/MS
    2.331/2024 altera a IDADE MINIMA PARA 18 ANOS — 'usuarios adultos' passa a ser
    definicao normativa. Todas lidas no original. Corrigidas as secoes 01, 02, 04, 05."
  tempos_do_usuario: "consulta 15-20 min; teleconsulta retorno 10-15; ECG 5-10 (execucao,
    telelaudo); coleta laboratorial 5-10; ecocardiograma transtoracico 20-30."
  jornada: "polo em DOIS TURNOS DE 4 HORAS (08-12, 13-17); modulos de 20h semanais por
    profissional = 4h/dia. Sabado aumenta a capacidade ~20% sobre a mesma infraestrutura."
  dimensionamento: "MEDICO 66,8 a 96,4 h/dia/polo -> 17 a 25 profissionais por polo,
    50 a 72 nos tres. TECNICO 14,8 a 29,7 h/dia -> 4 a 8 por polo. SALAS DE ECO 4 a 6
    por polo, 12 a 18 no conjunto. COM SABADO: 15 a 21 medicos/polo e 4 a 5 salas."
  achado_da_rodada: "O GARGALO E O MEDICO, E DENTRO DELE O ECOCARDIOGRAMA — 44% do tempo
    medico do polo. O plano anterior SUBDIMENSIONAVA: la a faixa de 17 a 25 cardiologistas
    era para o CONJUNTO; aqui e por POLO. A diferenca e que agora o eco esta contado."
  vinculo: "100% PJ, decisao do usuario. Classificado como EQUIPE PROPRIA (art. 33 §4º),
    com relacao nominal de PJs e profissionais como mitigacao. RISCO ALTO: o §1º define
    subcontratacao de forma ampla e o §2º so admite ATIVIDADES ACESSORIAS — o ato medico
    e atividade-fim, entao se cair no §1º o §2º NAO SALVA: e vedacao, nao irregularidade
    sanavel. Virou DV-052."
  subcontratacao: "limpeza, vigilancia, TI, telelaudo de ECG e analise laboratorial.
    NAO se subcontrata consulta, eco, teleconsulta nem gestao/coordenacao/direcao."

rodada_07_planilha:
  arquivo: "redacao_02/secoes/07_planilha.md"
  decisoes_2026_08_24:
    tempos_administrativos: "recepcao 5 min, agendamento 3, confirmacao 1, busca ativa 5,
      registro/APAC 4 (unico corrigido pelo usuario; os outros quatro eram suposicao minha
      e viraram decisao dele)."
    ti_e_supervisao: "por polo. TI entra como SERVICO contratado, nao como posto."
    coordenacao: "1 administrativo + 1 tecnico + 1 financeiro POR POLO = 9 no conjunto."
    postos: "CONSTANTES nos dez meses; folga dos meses 1 e 2 absorvida pela implantacao."
  memoria_de_calculo: "28,22 h/dia/polo = 3,53 postos de 8h; contratam-se 4, ocupacao 88,2%.
    Total 8 postos de apoio por polo (4 operacionais + supervisao + 3 coordenadores),
    24 no conjunto."
  resultado_final: "11 postos de apoio por polo, 33 no conjunto. APOIO R$ 2.966.419,90
    (polos 2.887.119,90 + central 79.300,00). PRODUCAO R$ 7.000.000,00. GLOBAL
    R$ 9.966.419,90. Teto R$ 10.000.000,00. DIFERENCA R$ 33.580,10 NAO DISTRIBUIDA.
    Apoio = 29,8% do global. Resmas: 5 folhas por OCI = 350 resmas = R$ 10.500,00."
  cenario_descartado: "Com os precos do pt_ses_01 (os mais caros): apoio R$ 4.349.032,50,
    global R$ 11.349.032,50 — ESTOURO de R$ 1.349.032,50 sobre o teto. Foi o que fez o
    usuario decidir pela referencia de menor valor em 24/08/2026. CUSTO DA DECISAO: preco
    subestimado vira risco de execucao, nao economia — vai para a rodada 11."
  reversao: "O usuario REINCLUIU o estoquista que eu havia cortado, e acrescentou 2a
    recepcionista e assistente financeiro por polo. A 2a recepcionista ganhou argumento
    proprio: dimensionamento por PICO DE CHEGADA, nao por media."
  eco_decidido_pela_aritmetica: "Com R$ 41.980,10 de folga, o envelope comportaria aluguel
    de R$ 279,83/aparelho/mes com 12 aparelhos ou R$ 186,56 com 18. Nao existe no mercado.
    Logo: OU o equipamento esta dentro do R$ 200,00, OU o desenho nao cabe no valor da
    emenda. Nao ha terceira hipotese."
  linha_mais_fragil: "9 coordenadores = R$ 540.000,00 em 10 meses, 18% do apoio, tres
    chefes para oito subordinados por polo. Art. 17, IV veda taxa de administracao e camada
    pesada de coordenacao e lida como administracao disfarcada. NAO ALTERADA — decisao
    explicita do usuario, com a fragilidade registrada."
  achado_da_rodada: "AC-049 — OS 4 PLANOS APROVADOS SAO DE DOIS PROPONENTES. pt_ses_01 tem
    CNPJ 17.517.805/0003-71; pt_ses_02, 03 e 04 tem TODOS o CNPJ 05.117.522/0001-91, com
    precos identicos linha a linha. 'Usar os quatro planos' produz DUAS referencias, nao
    quatro. Tratamento: onde as duas familias informam a mesma linha, adotado o MENOR VALOR
    (economicidade, art. 18) — 9 de 19 linhas; onde so uma informa, marcado FONTE UNICA na
    propria tabela do documento — 8 linhas, 42% dos itens, percentual declarado. Melhor que
    os 96,55% do plano anterior, e continua nao sendo pesquisa de precos."
  tres_linhas_cortadas: "comunicacao institucional (nao aponta passo do fluxo), estoquista
    (consumo assistencial esta no valor unitario; o administrativo e so papel) e pesquisa de
    satisfacao (ja descartada na rodada 2)."
  questao_em_aberto: "ECOCARDIOGRAFO — dentro do R$ 200,00 ou locacao pelo art. 17, I?
    Ponto de equilibrio calculado em vez de preco inventado: R$ 3.194,83/aparelho/mes com 12
    aparelhos, R$ 2.129,89 com 18. Acima disso nao cabe no teto e o ajuste vira de desenho.
    E a LOCACAO DE R$ 20.000 e de polo menor que o nosso — segunda maior linha do apoio,
    provavelmente subestimada."

rodada_08_desembolso:
  arquivo: "redacao_02/secoes/08_desembolso.md"
  decisoes_2026_08_24:
    p1: "implantacao + OCI previstas do primeiro trimestre — logo, ANTECIPADA."
    ritmo: "TRIMESTRAL. Quatro parcelas."
    custo_acessorio: "DESENHO A — despesa comprovada. Decidido depois de o usuario
      desconfiar da minha inferencia e pedir para checar a norma. Eu havia escrito o
      apoio como proporcional a OCI (desenho B), inferindo de 'o resto so e pago com
      base no atendimento das OCI'. A inferencia NAO se sustentava: arts. 16, 17, 21,
      26 e 27 desenham o mecanismo pela DESPESA, com devolucao de saldo remanescente e
      juizo de compatibilidade — nao por corte automatico. DV-054 registrada."
    producao_abaixo: "'nao recebemos por elas' — a OCI nao concluida nao gera pagamento,
      nem producao nem a parcela de apoio correspondente."
    apos_p1: "tudo pago com base no atendimento das OCI."
  dois_componentes: "PRODUCAO por unidade (R$ 200,00 por OCI concluida e aprovada;
    OCI nao concluida nao e paga) e CUSTO ACESSORIO por despesa comprovada dentro do
    teto mensal do plano. Logicas diferentes, e nao se confundem."
  parcelas: "P1 mes 1 apos termo de aptidao R$ 1.789.925,97 (apoio 3 meses 889.925,97 +
    4.500 OCI 900.000); P2 inicio do mes 4 R$ 3.489.925,97 (889.925,97 + 13.000 OCI);
    P3 inicio do mes 7 R$ 3.589.925,97 (889.925,97 + 13.500 OCI); P4 inicio do mes 10
    R$ 1.096.641,99 (1 mes 296.641,99 + 4.000 OCI). Cada uma ajustada por DOIS acertos
    do trimestre anterior: producao prevista x realizada, e apoio previsto x despesa
    comprovada. Apoio 10 meses = 2.966.419,90; producao 35.000 x 200 = 7.000.000;
    total 9.966.419,90 — confere."
  producao_baixa: "Producao nao realizada NAO e paga — aritmetica, sem juizo. Custo
    acessorio NAO cai automaticamente: cai pelo nao gasto. O descompasso entre recurso
    aplicado e resultado obtido e tratado em tres degraus — devolucao de saldo
    remanescente (art. 26 §1º), juizo de compatibilidade (arts. 26 e 27) e escada do
    art. 25 conforme a gravidade. A CAUSA decide o degrau, e o IND-06 e o que distingue
    fila nao encaminhada de falha de busca ativa."
  achado_da_rodada: "O DECRETO 48.727/2026 E SILENTE sobre parcelas, periodicidade e
    antecipacao — as unicas ocorrencias de 'repasse' sao 'suspensao de repasses', como
    sancao (arts. 25 e 34). E o art. 32 § unico da Portaria 10.297/2026 ('ate seis
    parcelas') rege a transferencia MS -> Fundo de Saude do DF, NAO o pagamento do
    convenio ao executor. Logo o cronograma de desembolso e construcao do plano."
  antecipacao: "Declarada na secao 9.5, com quatro amarras: entrega aferida antes da
    liberacao (Meta 2 / IND-03), conta especifica (art. 19), aplicacao vinculada (art. 20)
    e compensacao trimestral. Falta o dispositivo — DV-053."

rodada_09_contas_monitoramento:
  arquivo: "redacao_02/secoes/09_contas_monitoramento.md"
  decisoes_2026_08_24:
    ritmo: "relatorio mensal de execucao (ate o dia 15 da competencia seguinte) + acerto
      trimestral junto de cada parcela + prestacao de contas final em ate 60 dias. So a
      ultima e exigida pela norma; as duas primeiras existem porque sem apuracao mensal
      nao ha lastro para o ajuste trimestral do desembolso."
    escada: "CINCO DEGRAUS aprovados — 1 saneamento, 2 glosa, 3 suspensao de repasses,
      4 REPROGRAMACAO DO OBJETO, 5 rescisao. Graduados por magnitude, reincidencia e
      CAUSA, dando conteudo ao 'conforme a gravidade do caso' do art. 25."
    monitoramento_executor: "UM coordenador, acumulando a funcao, sem cargo novo e sem
      linha nova na planilha. Escrito como UM SO para o convenio (ponto unico de
      interlocucao), nao um por polo — leitura declarada para o usuario conferir."
  prazos_todos_da_norma: "60 dias para apresentar (art. 26 §2º); 30 para devolver saldo
    (art. 26 §1º); 30 na notificacao por nao envio (art. 26 §3º); 60 informatizado ou
    180 convencional para analisar, prorrogaveis uma vez (art. 30); 45 para sanear
    irregularidade (art. 30 §3º); prazo do caso para falha formal (art. 29). NENHUM
    arbitrado."
  degrau_4: "A REPROGRAMACAO DO OBJETO e a resposta institucional a tres achados que sem
    ela nao teriam saida: margem de 7,2% na fila (rodada 4), 89 entradas/polo/dia util
    (rodada 5) e o executor nao controlar o encaminhamento (rodada 8). Nos tres o
    resultado observavel e o mesmo — meta nao atingida — e a causa e diferente."
  transparencia: "art. 92 da Portaria GM/MS 10.297/2026 — publicacao em sitio proprio dos
    valores recebidos e aplicados de emendas individuais desde 2020, admitida planilha do
    Transferegov.br; paragrafo unico obriga informar o endereco ao orgao transferidor.
    Lido no original. Absorveu a antiga secao de transparencia."

rodada_10_contrapartida:
  arquivo: "redacao_02/secoes/10_contrapartida.md"
  decisao: "NAO HA CONTRAPARTIDA, e nao se declara contrapartida voluntaria."
  cadeia_de_nao_incidencia: "O Decreto 48.727/2026 NAO menciona contrapartida (verificado
    no texto integral). A resposta nao e um dispositivo que dispensa — e uma CADEIA DE NAO
    INCIDENCIA com tres elos, todos lidos no original: (1) art. 39 § unico do 48.727 limita
    a IN CGDF 01/2005 aos convenios com recursos DISTRITAIS, e este e emenda FEDERAL;
    (2) art. 38 remete as parcerias com OSC ao regime proprio, afastando a Portaria SES-DF
    187/2026, que e do MROSC; (3) o recurso vem por transferencia FUNDO A FUNDO, nao por
    convenio com a Uniao, o que afasta a exigencia da via federal. ENCERRA a antiga LC-039,
    cuja pergunta estava mal formulada."
  leitura_alternativa_declarada: "'Recursos distritais' e lido como recurso de ORIGEM
    distrital. Cabe a leitura de que, creditado ao FSDF e executado no orcamento distrital,
    seja distrital para efeito do art. 39 — hipotese em que a IN CGDF 01/2005 se aplicaria
    INTEIRA, com Anexos I a VII. Registrada como risco na rodada 11."
  L026_encerrada: "A recusa da contrapartida voluntaria fechou o ecocardiografo POR
    ELIMINACAO: despesa do convenio descartada na rodada 7 pela aritmetica (R$ 279,83 por
    aparelho/mes); contrapartida em bens descartada aqui por decisao; resta CAPACIDADE
    INSTALADA DO EXECUTOR, remunerada no valor unitario — que e como o SUS remunera
    procedimento. O plano passa a dizer isso expressamente."
  achado_eleitoral: "ART. 40 DO DECRETO 48.727/2026 — celebracao, execucao, LIBERACAO DE
    RECURSOS e divulgacao institucional observam, no periodo eleitoral, a Lei 9.504/1997,
    a LC 101/2000 e atos do TSE; o § unico faz disso CONDICAO PARA A PRATICA DOS ATOS.
    2026 e ano eleitoral e ultimo ano de mandato. Alcanca (a) art. 42 da LRF — vedado
    contrair nos dois ultimos quadrimestres obrigacao com parcelas no exercicio seguinte
    sem caixa, e a P4 e o acerto final caem depois do mes 10; (b) art. 73 da Lei 9.504,
    inclusive divulgacao institucional, o que toca o art. 92 da Portaria 10.297/2026.
    Vai para a rodada 11 (risco) e 14 (base legal). L-037: data de celebracao."

documento_13_secoes:
  decisao: "Em 24/08/2026 o usuario mandou RETIRAR a contrapartida do documento. O plano
    passou de 14 para 13 secoes; as antigas 12 (equipe) e 13 (prestacao de contas) viraram
    11 e 12, e riscos virou 13. Referencias cruzadas corrigidas em todos os arquivos."
  mapa: "1 Identificacao e base legal (rodada 14) | 2 Objeto (1) | 3 Justificativa (12) |
    4 Proponente e condicoes de partida (13) | 5 Metodologia e fluxo (4) | 6 Metas (2) |
    7 Indicadores (3) | 8 Cronograma fisico (5) | 9 Desembolso (8) | 10 Planilha (7) |
    11 Equipe, estrutura e subcontratacao (6) | 12 Prestacao de contas e monitoramento (9) |
    13 Riscos (11)"

incidente_arquivo:
  data: 2026-08-24
  o_que: "secoes/06_equipe.md foi CORROMPIDO por um edit meu na rodada 7 — um replace cujo
    'old' colapsou para um unico caractere multiplicou a tabela de postos 150 mil linhas.
    Reconstruido por inteiro em 24/08/2026, com a renumeracao para secao 11 e o quantitativo
    administrativo ja fechado. Os outros nove arquivos foram verificados e estao integros."
  licao: "Nao usar s[s.index(a):s.index(b)] como chave de replace sem conferir que o trecho
    tem tamanho plausivel."

rodada_11_riscos:
  arquivo: "redacao_02/secoes/11_riscos.md"
  decisoes_2026_08_24:
    criterio: "seguir a linha dos outros planos — adotada a ESTRUTURA de oito colunas deles
      (com acao compensatoria separada de mitigacao e responsavel nomeado), NAO a aritmetica
      (AC-051). Acrescentado o CRITERIO ESCRITO de impacto, que eles nao tem: alto = perda
      >= 3.500 OCI (10% da meta) ou >= R$ 1.000.000,00 ou obrigacao de devolver ou
      impedimento de celebrar/executar."
    riscos_adicionais: "nenhum."
    bloco_o_que_o_desenho_elimina: "mantido."
  matriz: "VINTE riscos — 8 regulatorios, 9 de execucao, 3 financeiros. Escala P e I em
    5/10/15; nivel = P x I; Baixo 25-50, Medio 75-100, Alto 150-225. DEZ ALTOS: R-01 (PJ),
    R-02 (PAR/38.01), R-03 (PDS/PAS), R-06 (eleitoral), R-08 (capacidade, 225 — o maior),
    R-09 (ecocardiografistas), R-10 (exaustao da fila), R-13 (atraso na Etapa 1), R-17
    (mao de obra), R-18 (locacao)."
  leitura_dos_altos: "NENHUM dos dez e risco de operacao corrente — todos sao de PARTIDA ou
    de PREMISSA. Nove dos dez caem de classificacao quando a lacuna correspondente fechar
    (L-001/002, L-003, L-037, L-021/024, L-017, L-028, L-027, DV-052). O unico que nao
    depende de informacao externa e o R-13, intrinseco a um cronograma sem folga no fim."

rodada_12_justificativa:
  arquivo: "redacao_02/secoes/12_justificativa.md"
  decisao_central: "O usuario AUTORIZOU dizer abertamente que o quantitativo foi fixado
    pelo TETO FINANCEIRO e nao pela necessidade. Envelope comporta 35.167,9 OCI; fila
    comporta 37.731 pessoas; logo O LIMITE E O RECURSO — sobram 2.563 pessoas que o
    convenio nao alcanca."
  coincidencia_que_valida: "A meta de 35.000 fica 167,9 OCI abaixo do que o envelope
    permitiria, e 167,9 x R$ 200,00 = R$ 33.580,10 — EXATAMENTE o valor que a planilha
    declarou nao aplicado. O numero que a planilha deixou sobrando e o que a meta deixou
    de comprometer sao o mesmo, visto de dois lados. Nao foi construido: apareceu quando
    as duas contas foram feitas de forma independente."
  tres_limites: "O quantitativo esta no limite de TRES variaveis ao mesmo tempo — recurso
    disponivel (35.167 OCI), fila existente (37.731 pessoas) e capacidade instalavel
    (89 entradas/polo/dia util). Nao ha folga em nenhuma."
  economicidade: "Tres vias, nenhuma com adjetivo: proporcao (apoio = 29,8% do global),
    ausencia de duplicidade (nenhum custo assistencial na planilha, teste item a item) e
    rastreabilidade do preco (origem declarada linha a linha). A QUARTA VIA FALTA e esta
    dita no documento: nao ha comparativo com preco de mercado — L-038."
  o_que_nao_demonstra: "Secao 3.6, dentro do documento: complementaridade (L-004, sem o
    deficit da rede propria a fila prova que falta atendimento, nao que falta AO ESTADO),
    ancoragem no PDS/PAS (L-003, elegibilidade pelo art. 6º II) e reposicao da fila
    (L-017, margem de 7,2%)."
  antiarmadilha: "Escrita em decimo segundo lugar, NAO INTRODUZ NENHUM NUMERO NOVO. Cada
    afirmacao aponta para conta feita em outra rodada — fila (4), apoio (7), 89 (5), arcos
    (1), 29,8% (7). E verificavel por cruzamento interno."

rodada_13_proponente:
  arquivo: "redacao_02/secoes/13_proponente.md"
  sem_pergunta_bloqueante: "Secao quase toda normativa e de campo do proponente. Tudo lido
    no original: arts. 4º, 5º, 6º e 40 do Decreto 48.727/2026 e arts. 6º, 10, 24 e 92 da
    Portaria GM/MS 10.297/2026."
  achados_da_leitura:
    art_4_par2: "'A indicacao parlamentar NAO afasta o dever de analise da Administracao nem
      supre irregularidade, impedimento, incompatibilidade do objeto ou ausencia de
      capacidade da entidade.' O §3º permite a Administracao adotar selecao publica se a
      entidade indicada nao atender. A indicacao nao garante nada, e a habilitacao passa a
      ser o que SUSTENTA a celebracao, nao instrucao processual."
    art_5_V: "Experiencia previa e exigida 'quando exigida pela complexidade da proposta'.
      Escrito que ESTA exige, com a razao nos proprios numeros do plano: 35.000
      procedimentos, 3 polos, 50 a 72 medicos, parque proprio de ecocardiografia."
    cir_cib: "O DF NAO TEM CIR NEM CIB — e ente unico. A instancia de pactuacao do art. 10
      da Portaria e o COLEGIADO DE GESTAO da SES-DF. Adaptacao declarada no documento."
  quadro_4_7: "A contribuicao de metodo da rodada: as condicoes NAO SAO EQUIVALENTES.
    Habilitacao e manifestacao tecnica/juridica travam a CELEBRACAO; alteracao do PDS/PAS
    trava o RECEBIMENTO; deliberacao do Colegiado e Conselho travam a EXECUCAO FINANCEIRA;
    PAR e 38.01 travam o REGISTRO DA PRODUCAO; a restricao eleitoral condiciona A PRATICA
    DOS ATOS. Vencem em momentos diferentes e dependem de atores diferentes."
  lacunas: "NENHUMA NOVA. A secao consolida no lugar certo as ja abertas: L-001, L-002
    (4.4), L-003 (4.5), L-020 (4.4), L-037 (4.6) e os campos do proponente (4.1, 4.2)."

rodada_14_identificacao:
  arquivo: "redacao_02/secoes/14_identificacao.md"
  conta_das_citacoes: "12 normas e cerca de 40 artigos, contra 29 normas e 121 artigos do
    plano anterior e 1 a 5 normas dos quatro aprovados. Cada dispositivo tem, ao lado, a
    coluna 'o que faz aqui'. Nenhum artigo aparece duas vezes — fica na secao que decide, e
    a 1.2 apenas REMETE."
  tres_camadas: "fundamento (CF art. 199 §1º + Lei 8.080/90 art. 24) decide se a entidade
    PODE executar; origem do recurso (Portaria GM/MS 10.297/2026) decide como o dinheiro
    CHEGA; instrumento (Decreto DF 48.727/2026) decide como o convenio FUNCIONA. O plano
    anterior errou aqui — usou o Decreto 37.843/2016, que e MROSC, como camada distrital."
  secao_1_3: "DECLARAR O QUE NAO INCIDE — MROSC e Decreto 37.843/2016, Portaria SES-DF
    187/2026, IN CGDF 01/2005 e a NT 2/2025 (teto do PMAE). Nenhum dos quatro aprovados faz
    isso. Vale porque o vocabulario do MROSC circula na SES e nos proprios planos aprovados
    (AC-045: chamam a entidade de OSC e o instrumento de convenio). Custa quatro linhas."
  vigencia: "execucao 10 meses; instrumento ate 60 dias apos, para o acerto da ultima
    competencia e a prestacao de contas final (art. 26 §2º)."
  conferencias: "vigencia x objeto, vigencia x cronograma, valor global x planilha, valor
    global x desembolso, quantitativo x soma das metas, valor global x teto — todas na
    secao 1.4 do documento."

proxima_etapa:
  remontagem: "As 13 secoes existem. Falta: (1) montar na ordem de leitura com numeracao
    corrida; (2) conferir referencias cruzadas apos a renumeracao; (3) rodar as conferencias
    aritmeticas de ponta a ponta; (4) consolidar os [preencher] num indice de pendencias com
    dono; (5) gerar o .docx por redacao/md2docx.js."

remontagem:
