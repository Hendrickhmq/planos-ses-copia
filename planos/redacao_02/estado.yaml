  higiene: "ZERO vazamento de metodo no documento — nenhuma ocorrencia de rodada,
    L-xxx, AC-xxx, DV-xxx, achado, corpus, plano anterior ou pt_ses em plano.md."
  pendencias: "43 marcacoes: 19 do proponente, 17 da SES-DF, 7 dos dois. Sete antecedem
    a assinatura."

versao_de_apresentacao:
  data: 2026-08-25
  pedido: "Hendrick precisa da versao final para apresentar ao professor, e ela nao pode
    ter campos [preencher] nem blocos de autoconferencia."
  o_que_mudou:
    marcacoes: "43 -> 0. Vinte e um campos de formulario viraram celula em branco (—);
      vinte e um viraram PROSA que declara de quem e a informacao e quando ela entra;
      um estava resolvido e o texto e que estava defasado."
    autoconferencia: "removidos do documento os blocos 1.4 (Conferencia de coerencia),
      10.6 (Conferencias) e o quadro de 'confere' da secao 9.3. Sao metodo — continuam
      nos fechamentos das rodadas e no estado."
    correcao_10_7: "A secao 10.7 apresentava como ABERTA a classificacao do ecocardiografo,
      que a rodada 10 ja havia FECHADO por eliminacao (capacidade instalada do executor,
      remunerada no valor unitario) e que a secao 11.3 ja afirmava. Era defeito da
      remontagem, nao campo em branco. Reescrita como 10.6, com a conclusao aplicada e a
      aritmetica mantida como argumento."
    renumeracao: "secao 1 perdeu a 1.4; secao 10 perdeu a antiga 10.6 e a 10.7 virou 10.6.
      Sem buraco de numeracao e sem referencia orfa — verificado."
  resultado: "plano.md 1.625 linhas, plano.docx 85 KB. Zero [preencher], zero 'confere',
    zero vazamento de metodo. pendencias.md passa a ser o UNICO registro do que falta."

poda_de_repeticao:
  data: 2026-08-25
  pergunta_do_usuario: "'essas coisas tem que estar no plano de trabalho?' — sobre o
    paragrafo da antiga 5.6 que explicava o teste da duplicidade."
  varredura: "Doze argumentos recorrentes conferidos. Onze sao o mesmo numero USADO em
    lugares diferentes (89 entradas: 8.3 deriva, 10.3 e 11.2 usam, 3.3 argumenta, 13.2
    arrisca; R$ 33.580,10: 10.5 produz, 3.3 argumenta, 13.4 elimina; equipe propria:
    1.2 lista, 11.4 classifica, 13.2 arrisca; FAEC: 1.1 declara, 4.4 questiona, 13.2
    arrisca) — legitimo. UM era repeticao real."
  removida: "SECAO 5.6 (O que ja esta dentro do valor unitario). Repetia a coluna de setor
    da 5.1 e antecipava a 10.2, que e onde a regra OPERA. O sentido dela virou uma frase
    na abertura da 5.1: 'A coluna de setor antecipa a separacao que a secao 10 executa'.
    A 11.1 foi mantida porque responde a pergunta que nasce ali — a secao descreve 50 a 72
    medicos e o leitor quer saber por que nao estao no dinheiro."
  resultado: "plano.md 1.614 linhas, plano.docx 84 KB. Secao 5 passa a ter 5 subsecoes."

corte_parecer_professor:
  data: 2026-08-31
  origem: "Parecer do professor sobre o plano: 'muito bom para estudo, mas nao para ser
    aprovado' e 'estamos ensinando o padre a rezar missa' — explicar a quem aprova como
    funciona aquilo que ele ja sabe. Tres cortes nomeados por ele."
  decisao_do_usuario: "'corta 4.5, 4.6, 4.7 e a 10.4 inteira, regra 3 como regra interna.'
    O 4.7 e a 10.4 inteira foram alem do que o professor nomeou — decisao do usuario,
    depois de eu apontar que ficariam orfaos."
  principio_adotado: "O plano de trabalho e peca de instrucao processual, nao memorial.
    Toda frase afirmada vira obrigacao aferivel na prestacao de contas. Ver o TESTE DO
    LEITOR em 00_metodo.md — tres perguntas por paragrafo, a terceira nova."
  removido_do_documento:
    - "4.5 Condicoes de execucao financeira — lista de atos da CONCEDENTE"
    - "4.6 Restricao eleitoral — incide sozinha; escrever entrega motivo de sobrestamento"
    - "4.7 O que trava o que — ensinava a concedente a ordem dos proprios atos"
    - "10.4 A origem dos precos — confessava que a referencia nao e pesquisa de precos"
    - "3.5, bullet 'a terceira e a rastreabilidade do preco' — prometia o que a 10.4 desmentia"
    - "coluna 'origem' das duas planilhas — marcava linha a linha os precos frageis"
    - "risco R-06 (restricao eleitoral) — repetia a 4.6 na matriz, classificado Alto (150)"
    - "1.2: linhas do art. 10 da Portaria 10.297, art. 40 do Decreto 48.727, art. 42 da
      LRF e art. 73 da Lei 9.504 — orfas dos cortes acima"
  reescrito_sem_confissao:
    - "R-17: era 'adotada a referencia de menor valor, sem pesquisa propria'; virou
      'subestimado em relacao ao praticado no Distrito Federal'. O risco fica, o metodo sai."
    - "R-18: era 'as referencias sao de polos com programa de necessidades menor'; virou
      'subestimada em relacao ao programa de necessidades real dos polos'."
    - "13.3: rotulo 'precos sem pesquisa propria' virou 'preco dos insumos de apoio'."
  mantido_e_por_que:
    regra_2: "Total nunca fecha por ajuste — MANTIDA no documento. A diferenca de
      R$ 33.580,10 continua declarada na 13.4. Nao e confissao de fragilidade: e prova de
      que nenhuma linha foi esticada."
    R_03: "Objeto sem ancoragem no Plano Distrital e na PAS — MANTIDO. E risco substantivo
      do objeto, de responsabilidade da SES-DF, nao repeticao da ex-4.5."
    composicao_do_custo_acessorio: "MANTIDA INTEGRAL na planilha. Os arts. 16 a 18 do
      Decreto 48.727/2026 exigem que ela se leia; planilha ilegivel e o que dispara a
      leitura de taxa de administracao disfarcada, que e vedada, com devolucao corrigida
      recaindo sobre o convenente. Opacidade de composicao de custo cria a glosa que se
      queria evitar."
  regra_3_alterada: "Era: 'dependencia de fonte unica e risco escrito, nao rodape — o
    percentual vai no documento e vira risco'. Passa a ser CONTROLE INTERNO: rastreada
    linha a linha em verificacoes_internas.md, onde define a prioridade da pesquisa de
    precos. Nao vai ao documento."
  achado_de_fato: "A 10.4 publicava '8 das 21 linhas, 38% dos itens' em dependencia de
    fonte unica. A contagem real da planilha e 10 de 21, 47,6%. O numero publicado estava
    ERRADO — argumento adicional para nao publica-lo. O correto esta em
    verificacoes_internas.md, V-08."
  arquivo_novo: "verificacoes_internas.md — V-01 a V-11, com dono, momento e o que cada
    verificacao trava. NAO E ENTREGUE. Nada foi apagado: tudo que saiu do plano esta la."
  resultado: "plano.md 15.132 -> 14.004 palavras. Aprovados de referencia: 4.543, 4.803,
    7.054 e 12.291. AINDA ACIMA DO MAIOR — o corte nao terminou."
  em_aberto:
    percentual_29_8: "A 3.5 ainda abre com 'as despesas de apoio somam 29,8% do valor
      global' e a 10.4 (ex-10.5) fecha com 'o apoio corresponde a 29,8%'. Ninguem pediu
      essa razao: o plano a calculou, destacou em negrito e apresentou como virtude,
      convidando o 'por que 29,8 e nao 15?'. Proposta feita ao usuario e AINDA NAO
      DECIDIDA: o numero deixa de ser tese na prosa e volta a ser total na planilha.
      Mesma informacao disponivel, zero alca."
    docx: "plano.docx regerado em 31/08/2026 — 86 KB -> 81 KB."

correcao_in_cgdf_01_2005:
  data: 2026-08-31
  origem: "Correcao do usuario: 'Essa IN entra Instrucao Normativa CGDF no 01/2005
    (isso entra), voce marcou que nao entrava.'"
  estava_errado: "Secao 1.3 afirmava que a IN NAO incide; secao 1.2 registrava o art. 39,
    paragrafo unico como limitador; risco R-05 tratava a incidencia como hipotese remota
    (Baixo, 50). A heranca do 00_metodo.md e a memoria repetiam a leitura errada."
  leitura_correta: "Art. 1o da propria IN: alcanca convenios que envolvam transferencia
    de recursos oriundos de DOTACOES CONSIGNADAS NOS ORCAMENTOS FISCAL E DA SEGURIDADE
    SOCIAL. O gatilho e o veiculo orcamentario da transferencia, nao a origem do recurso.
    A emenda federal chega fundo a fundo ao FSDF e o repasse ao convenente sai de dotacao
    do Orcamento da Seguridade Social do DF."
  erro_de_raciocinio: "O art. 39, paragrafo unico do Decreto 48.727/2026 e proposicao
    AFIRMATIVA ('aos convenios custeados com recursos distritais aplica-se...'), nao
    excludente. Nao existe 'nao se aplica aos demais'. A exclusao foi deduzida a
    contrario. O art. 37 do mesmo Decreto ainda manda observar as normas orcamentarias e
    financeiras do DF em geral."
  aplicado_no_plano:
    - "1.2: linha do art. 39, paragrafo unico REMOVIDA"
    - "1.3: linha da IN CGDF 01/2005 REMOVIDA"
    - "R-05 REMOVIDO (a premissa era a leitura errada)"
    - "matriz renumerada R-01..R-18 (R-06..R-19 deslocados em 1); 13.3 passa a 'dos
      dezoito riscos, nove sao altos' — conferido: 9 linhas com nivel 150 ou 225"
  por_que_nao_foi_substituido_por_afirmacao_correta: "A IN incide dita ou nao dita.
    Varredura nos quatro aprovados: NENHUM cita a IN, a CGDF ou a Controladoria. Mesma
    logica do corte da restricao eleitoral — vira controle interno (V-12)."
  em_aberto:
    anexo_I: "A IN manda o plano ser apresentado 'nos moldes do Anexo I', formulario de 4
      folhas. NENHUM dos quatro aprovados tem esse formato. Leitura compativel com quatro
      aprovacoes: o formulario e peca propria do processo SEI e o documento narrativo o
      acompanha. CONFIRMAR COM O PROFESSOR."
    declaracao_nao_mora: "Art. 2o, VIII exige declaracao de que o convenente nao esta em
      mora nem inadimplente junto a qualquer orgao do DF. Documento a produzir — nao
      temos."
    contrapartida: "A rodada 10 retirou a secao de contrapartida com a justificativa
      'nenhuma norma a exige', que se apoiava na premissa de que a IN nao incidia. O art.
      2o, VI a menciona como condicional ('se for o caso'). Provavelmente continua fora,
      mas o MOTIVO mudou. Reverificar."
    anexos_prestacao_de_contas: "Anexos III a VII (Relatorio de Execucao Fisico-Financeira,
      Demonstrativo da Receita e Despesa, Relacao de Pagamentos, Relacao de Bens) passam a
      ser as pecas nomeadas do ciclo de contas. Convergem com o corte da secao 12, que
      nenhum aprovado tem."

acervo_pt_ses_05:
  data: 2026-08-31
  arquivo: "planos_aprovados/pt_ses_05_031061-2026.pdf — 58 paginas, 17 MB"
  extracao: "python3 extrair_planos.py planos_aprovados/ extraidos/ --doc pt_ses_05.
    PDF INTEIRAMENTE DIGITALIZADO: OCR nas 58 paginas, ZERO tabelas estruturadas
    (contra 25 no pt_ses_01 e 26 no pt_ses_02). Valores corrompidos em varios pontos.
    So foi usado numero que fecha por conferencia cruzada em dois pontos do documento.
    NAO conferido contra o PDF em registros/conferencia.csv — pendente."
  o_que_e: "SEGUNDO plano do ISHP. Mesmo titulo do pt_ses_01 ('Visao Alem do Alcance'),
    outro convenio: 2/jul/2026, R$ 2.000.000,00, 8 meses, 8.400 OCI de Oftalmologia a
    R$ 200,00. PRIMEIRA referencia do acervo com o MESMO valor unitario e a MESMA
    natureza de produto que o nosso objeto."
  totais_conferidos: "Meta 1 = 290.400,00 (Etapa 1.1 106.079,52 + Etapa 1.2 184.320,48);
    Meta 2 = 1.680.000,00 (8.400 x 200); Meta 3 = 29.600,00; TOTAL 2.000.000,00. Fecha
    contra a capa, contra a linha Total do cronograma de desembolso e contra a soma da
    Meta 1. O 'Total Geral > 990.000,00' da planilha e lixo de OCR."
  custo_acessorio: "320.000,00 = 16,00%"
  por_que_16_por_cento: "O plano declara: 'as rubricas de apoio foram dimensionadas com
    base no CUSTO INCREMENTAL, considerando o APROVEITAMENTO DA ESTRUTURA JA EXISTENTE da
    OSC'. Ele pega carona na estrutura do pt_ses_01, montada 3 meses antes. Etapa 1.1
    inteira = 3 pessoas (R$ 106.079,52) contra R$ 1.718.095,68 do pt_ses_01."
  correcao_da_banda: "A banda 30,65%-36,57% CONTINUA VALIDA, mas e a banda de quem
    LEVANTA ESTRUTURA (pt_ses_01 a 04). O pt_ses_05 e outra classe (complementa estrutura
    existente). Nosso plano levanta 3 polos do zero — classe 1. ATENCAO: se o proponente
    ja tiver polos operando, o parametro despenca e o argumento de 'custo incremental'
    passa a ser exigivel CONTRA nos."
  achado_maior_diligencia:
    oficio: "Oficio no 25/2026 - SES/SECCIC/SUCONV/DIPCP/GPICP, Processo SEI
      00060-00171435/2026-61. O PDF traz a RESPOSTA DO ISHP a essa diligencia."
    o_que_a_ses_pediu:
      - "atualizacao da vigencia do projeto"
      - "apresentacao DETALHADA da rubrica 1.2.7 (Material de Consumo Administrativo), com
        discriminacao dos itens, quantitativos estimados, VALORES UNITARIOS e MEMORIA DE
        CONSUMO MENSAL"
      - "Cronograma de Desembolso Financeiro - 'Anexo I', com distribuicao temporal"
    licao: "O analista abriu diligencia por FALTA de detalhamento de composicao de custo.
      Uma rubrica agregada de material de consumo gerou exigencia formal. A resposta foi
      planilha com mais de vinte itens (inclusive cafe, acucar, adocante, filtro de papel)
      com valor unitario e consumo mensal. O crivo NAO e austeridade, e DISCRIMINACAO:
      rubrica agregada gera exigencia, rubrica aberta passa."
    exposicao_nossa: "Nossa planilha tem UMA linha de material de consumo (item 21, Resma
      de papel A4, 350 un, R$ 30,00, R$ 10.500,00). E exatamente a rubrica que gerou o
      Oficio 25/2026 contra o ISHP. Estamos expostos a mesma diligencia — agora por
      evidencia, nao por suposicao."
  notas_menores:
    referencia: "A coluna REFERENCIA evoluiu: pt_ses_01 (abril) 'Valores definidos com
      base em...'; pt_ses_05 (julho) 'Valores definidos com base em PESQUISA DE MERCADO e
      parametros de economicidade'. Invoca a pesquisa sem junta-la e sem confessar que
      nao a tem."
    anexo_I: "Aqui 'Anexo I' e o CRONOGRAMA DE DESEMBOLSO, nao o formulario do plano. Nao
      resolve a duvida do V-12. Mas o cabecalho dos dois planos do ISHP e formulario
      ('DADOS E INFORMACOES DA OSC', 'ANEXOS [x] Portfolio da OSC') — corrige em parte a
      Parte 1 da analise, que dizia que nenhum aprovado tinha formato de formulario."
  pendencia: "Conferir as leituras de OCR contra o PDF e registrar em
    registros/conferencia.csv (conferencia.py --marcar pt_ses_05)."

reextracao_pt_ses_05_resolvida:
  data: 2026-08-31
  substitui: "as ressalvas de OCR registradas em acervo_pt_ses_05, que CAEM."
  script: "extrair_digitalizados.py (novo). PDF digitalizado nao se resolve com DPI
    (150->85,5; 300->86,5; 400->87,0 de confianca). Resolve-se lendo a GRADE, que no
    digitalizado esta em pixel: binariza, acha reguas por projecao, confere se a regua
    vertical existe DENTRO da linha (nao existindo, celula mesclada), e faz OCR de cada
    celula isolada."
  causa_do_defeito: "O timbre e impresso DENTRO da faixa de linha da tabela. Na pagina 41
    a faixa ia de y=61 a 1831 e continha a data do cabecalho E o valor da rubrica na mesma
    tira: o OCR devolvia 'de 2026 R$ 69.' truncado. Filtrar POR LINHA era errado de
    origem — apagava o dado junto com o timbre. Tres tentativas falharam (casar texto da
    faixa; casar por token repetido, que comeu a linha 3.1.1; exigir cauda numerica, que
    apagou 1.1.1 e 1.2.4 inteiras). O que resolve e recortar por COORDENADA antes do OCR."
  faixa_util: "y 372..3176, detectada por constancia de tinta entre paginas. A amostra tem
    de vir SO de paginas com grade — o oficio do fim tem outro timbre e contamina."
  costura: "Paginas seguidas com a mesma grade sao a mesma tabela logica; linha com a
    primeira coluna vazia e continuacao e se funde celula a celula. Gera
    planilha_p041-p053.csv, 25 linhas, a planilha inteira num arquivo."
  resultado: "0 -> 17 tabelas; confianca 86,5 -> 93,2; 12 de 12 rubricas lidas (antes 10);
    1.1.1 (R$ 69.680,00) e 1.2.4 (R$ 12.520,00) agora LIDAS, nao deduzidas."
  fechamento: "Somando os itens lidos: 1.1.x = 106.079,52 = Sub-Total Etapa 1.1;
    1.2.x = 184.320,48 = Sub-total Etapa 1.2; Meta 1 = 290.400,00; TOTAL = 2.000.000,00 =
    Total Geral e valor global da capa. QUATRO niveis."
  defeito_remanescente: "Codigo do item da OCI saiu '2141' em vez de '2.1.1' (ponto perdido
    no OCR). Normalizado o caso univoco (tres digitos: '1.24' -> '1.2.4'); com quatro
    digitos nao se adivinha. Listado em meta.yaml como codigos_de_item_a_conferir. O VALOR
    da linha esta correto — e rotulo, nao numero."
  onde: "extraidos_ocr/pt_ses_05/ (texto.md, 17 CSVs, planilha costurada, meta.yaml com
    confianca por pagina). extraidos/ NAO foi tocado, para a leitura antiga continuar de pe.
    Registrado em registros/conferencia.csv como com_achado por CC."

poda_estrutural:
  data: 2026-08-31
  regra: "REGRA SIMPLES, dada pelo usuario: sai toda secao que nao aparece em NENHUM dos
    cinco planos aprovados. Sem meio-termo. Eu havia aplicado corte limpo em tres e
    'tratamento cuidadoso' em tres; o usuario corrigiu — sao as seis, inteiras."
  removidas_inteiras:
    - "1.2 Base legal (606 palavras). As citacoes que OPERAM continuam inline nas secoes
      que as usam; o que sai e o CATALOGO. Secao 1 fica so com o instrumento."
    - "1.3 O que nao incide (149). A premissa ja se provara falsa: declarava que a IN CGDF
      nao incidia, e declarar errado PROVOCA a diligencia."
    - "4.2 Elegibilidade e habilitacao (273), inclusive o paragrafo condensado que eu
      havia fundido na 4.1 numa primeira tentativa."
    - "4.3 A indicacao parlamentar nao supre requisito (111)."
    - "4.4 Condicoes de registro da producao (200) — PAR, habilitacao 38.01, APAC. Secao 4
      fica so com a identificacao do proponente, como nos aprovados."
    - "12. Prestacao de contas e monitoramento, 8 subsecoes (1.243). Com a IN incidindo,
      os Anexos III a VII SAO as pecas do ciclo de contas."
  religamentos: "4 ponteiros para a secao 12 religados ao art. 25 do Decreto 48.727/2026,
    onde a gradacao das medidas efetivamente mora. O R-07 apontava para 'degrau 4 da
    secao 12.6'."
  resultado: "13.906 -> 11.312 palavras (-18,7%). 12 secoes. ABAIXO DO MAIOR APROVADO
    (pt_ses_01, 12.291). Zero ponteiro orfao, zero tabela inconsistente. docx regerado.
    Backup em plano.md.bak3."
  custo_aceito: "A 1.2 ancorava a antecipacao da primeira parcela (arts. 27 e 32 da
    Portaria 10.297). Levantei o ponto, o usuario manteve a regra. Se o analista estranhar
    a antecipacao, a ancora se da em diligencia, nao no plano."

poda_da_subdivisao_interna:
  data: 2026-08-31
  regra: "A mesma do corte de secoes, aplicada a subdivisao: sai o que nao aparece em
    nenhum aprovado."
  o_que_os_aprovados_fazem: "IEV (3 planos): NENHUMA subsecao numerada. Dentro da secao 7
    ha dois titulos em caixa alta, sem numero. ISHP: subdivisao numerada existe em UMA
    unica secao, 'Detalhamento das Acoes (Metodologia Adotada)', de 1.1 a 4.3; todo o
    resto — objeto, fluxo, justificativa, descricao tecnica, cronograma, planilha — corre
    em prosa. Titulo SEM numero e atestado nos dois modelos ('Memoria de calculo —
    Infraestrutura', 'Composicao da Equipe Assistencial', 'Riscos Relacionados a Etapa 1')."
  aplicado: "37 subsecoes desnumeradas: '### 3.1 O problema' -> '### O problema'. A SECAO
    5 (Metodologia e fluxo do atendimento) MANTEVE a numeracao 5.1 a 5.5 — e a que
    corresponde ao 'Detalhamento das Acoes' do ISHP, unico lugar do acervo onde subsecao
    numerada e atestada."
  religamentos: "8 ponteiros internos ('seção 10.2', 'seção 9.5', ...) religados para
    'seção 10, em *o que não entra, e por quê*'. Sobraram so os dois que apontam para a
    secao 5, que continua numerada."
  densidade_de_titulos: "IEV 1 a cada 320 palavras; ISHP 1 a cada 285; NOSSO 1 a cada 195.
    Continuamos mais densos: o titulo sem numero e atestado, mas nao nesse volume. Se a
    regua for a densidade e nao a numeracao, o proximo passo e apagar titulo, comecando
    pela secao 3 (justificativa), que nos dois modelos corre em prosa corrida."
  backup: "plano.md.bak4"

titulos_na_forma_dos_aprovados:
  data: 2026-08-31
  achado: "A diferenca nao era uma lista de titulos, era uma FORMA. Todos os ~50 titulos
    dos cinco aprovados sao sintagmas nominais que nomeiam uma peca exigida (Descricao do
    Objeto, Metodologia, Cronograma Fisico, Planilha Global, Mapa de Risco, Dimensionamento
    das Equipes). NENHUM comeca com 'Por que', 'O que', 'Quando' ou 'Como'. Nenhum anuncia
    um raciocinio ou uma limitacao. Nossos: 15 de 46 eram argumentativos e mais 8 tinham
    voz editorial."
  cortados_com_o_conteudo:
    - "'O que esta justificativa ainda nao demonstra' — as tres confissoes: complementaridade
      nao demonstrada, ancoragem no planejamento pendente, e a margem de 7,2% da fila."
    - "'Concentracao dos riscos altos' — produzia a manchete 'dos dezoito riscos, nove sao
      altos', frase que nao existe em plano aprovado nenhum."
    - "'O que este desenho elimina' — o quadro dos quatro riscos que o desenho impede. A
      declaracao da sobra de R$ 33.580,10 (regra 2) NAO se perdeu: continua nas secoes 3 e
      10, conferido."
  renomeados: "21 titulos para a forma nominal. Exemplos: 'O que conta como entregue' ->
    'Unidade de afericao'; 'Por que estes tres polos' -> 'Distribuicao territorial dos
    polos'; 'Como esta planilha foi montada' -> 'Metodologia de composicao de custos';
    'O gargalo, dito por inteiro' -> 'Capacidade instalada de ecocardiografia'."
  ponteiros: "6 ponteiros internos do tipo 'secao N, em *titulo*' conferidos um a um contra
    os titulos novos. Zero orfao."
  resultado: "11.319 -> 10.687 palavras. 43 subtitulos, ZERO argumentativos. Densidade de
    titulos 1 a cada 194. Backup em plano.md.bak5."

fusao_no_modelo_ishp:
  data: 2026-08-31
  razao: "O ISHP tem UMA secao valendo 48% do plano — 'Detalhamento das Acoes (Metodologia
    Adotada)', 4.752 palavras, subdividida de 1.1 a 4.3 — e ela absorve metas, indicadores,
    dimensionamento de equipe, agendas, sistemas e acoes compensatorias. Nos espalhavamos o
    mesmo conteudo por quatro secoes. O conteudo era o mesmo; a ARRUMACAO diferia."
  aplicado: "Secoes 6 (Metas), 7 (Indicadores) e 11 (Equipe) fundidas na 5, que passa a
    'Metodologia e detalhamento das acoes' com 19 subsecoes numeradas 5.1 a 5.19. A ordem
    segue a logica do ISHP e a nossa propria dependencia: fluxo (5.1-5.5) -> equipe
    (5.6-5.11, derivada do fluxo) -> metas (5.12-5.15) -> indicadores (5.16-5.19), com o
    monitoramento no fim como no 4.x deles."
  renumeracao: "8->6 Cronograma fisico; 9->7 Cronograma de desembolso; 10->8 Planilha;
    12->9 Riscos. De 12 para 9 secoes, sem perder uma linha de conteudo (10.687 -> 10.672
    palavras; a diferenca sao os tres titulos de secao removidos)."
  religamento: "33 referencias internas religadas EM UMA PASSADA, com sentinela. Duas
    armadilhas registradas: (a) o lookahead (?![.\\d]) que protegia 'secao 5.4' tambem
    barrava 'secao 10.' em fim de frase — o correto e (?!\\.\\d); (b) substituir primeiro as
    referencias COM TITULO e depois rodar o mapa numerico remapeia as mesmas duas vezes.
    Referencias que apontavam para dentro das secoes fundidas viraram subsecao: 'secao 11,
    em *subcontratacao*' -> 'secao 5.11'; 'secao 7, em *a regra de afericao*' -> 'secao
    5.16'; 'secao 6, em *meta qualitativa*' -> 'secao 5.14'."
  verificacao: "Toda referencia conferida contra a estrutura nova: zero quebrada, zero
    titulo inexistente, zero tabela inconsistente. Backup em plano.md.bak6."
  onde_estamos: "10.672 palavras. ISHP limpo: pt_ses_01 = 9.887, pt_ses_05 = 13.627.
    ESTAMOS DENTRO DA FAIXA DO ISHP. Contra o IEV (maior: 7.054) ainda somos 51% maiores."
  ponto_em_aberto: "A secao 4 (Proponente) tem 84 palavras contra 439 da 'Apresentacao do
    Proponente' do ISHP. E a UNICA em que ficamos ABAIXO do modelo — a poda passou do ponto
    ali."

estrutura_padrao_fixada:
  data: 2026-08-31
  decisao_do_usuario: "'ja deixamos alinhado como vai ser a estrutura dos nossos planos
    daqui pra frente.' O padrao deixa de ser historico de edicao deste plano e passa a ser
    o modelo dos proximos."
  gravado_em: "00_metodo.md, secao 'A ESTRUTURA PADRAO — 9 secoes'. O parametro de calibre
    de 24/08 ('14 secoes, nao 20') foi revisto para 9. CONTINUAR.md teve o mapa de
    remontagem atualizado: a secao 5 vem de QUATRO arquivos (04_fluxo + 06_equipe +
    02_metas + 03_indicadores) e 09_contas_monitoramento e 10_contrapartida nao entram mais."
  investigacao_da_secao_4: "Perguntado por que nossa secao 4 tem 84 palavras contra 439 do
    ISHP. Decomposta a 'Apresentacao do Proponente' deles: so ~61 palavras (14%) falam do
    PROPONENTE. O resto e descricao de projeto que eles concentram ali e nos distribuimos —
    97 em politica/publico (nossa secao 2), 76 em fluxos (nossa 5.1), 69 em responsabilidade
    e subcontratacao (nossa 5.11), 136 em logica de cuidado (nossa secao 3). Em dois blocos
    somos MAIS fortes: eles AFIRMAM que nao ha subcontratacao do objeto; nossa 5.11 cita o
    art. 33, lista item a item o que e acessorio e declara o que NAO e subcontratado."
  as_61_palavras_que_faltam: "Sao decisao travada em 24/08 ('Destino: exercicio. Nada de
    prosa ficticia sobre o proponente'). Nao e poda excessiva; e parametro do exercicio, e
    se resolve sozinho havendo entidade real. O proprio ISHP remete o detalhe ao 'ANEXO I
    deste Plano de Trabalho', que e o portfolio institucional."
  buraco_real_encontrado: "NAO e de tamanho, e de conteudo: nao temos NENHUMA ancora de
    politica (Politica Nacional, Rede de Atencao, integralidade, equidade), e a unica
    mencao ao Plano Distrital de Saude no documento e o risco R-03 em negrito. Cortamos a
    confissao sobre ancoragem sem escrever a versao afirmativa. Registrado em pendencias.md
    como itens 47 e 48. O usuario optou por NAO escrever o paragrafo agora."
