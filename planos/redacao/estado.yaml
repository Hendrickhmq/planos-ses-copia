# ---------------------------------------------------------------------------
# A FONTE NÃO É O FAEC — 2026-08-20, informado pelo usuário
# ---------------------------------------------------------------------------
fonte_nao_e_faec:
  premissa_do_usuario: "Quando o recurso vem de emenda não há pagamento por FAEC.
    O Programa Agora Tem Especialistas, que é programa do FAEC, é utilizado só
    como BASE. Registro em APAC continua sendo necessário, para comprovar o
    atendimento."
  resolve: "DV-049 e o conflito_aberto do bloco norma_da_emenda: 2E90 (Incremento
    MAC) x 8585/PO 0005 (FAEC). Não são caminhos concorrentes — o segundo
    simplesmente não custeia este objeto."
  base_normativa_encontrada: "Portaria GM/MS 10.297/2026, Cap. II do Título de
    transferências: art. 24 (InvestSUS, componente Incremento MAC, CNES a
    informar); art. 27, IV (aplicação em ações e serviços do Agora Tem
    Especialistas); art. 27, II e §3º (convênio com entidade privada sem fins
    lucrativos, valor contemplando a totalidade dos recursos); art. 23, I, 'a'
    (produção FAEC entra como parcela de CÁLCULO DO LIMITE MAC, não como
    pagamento); art. 23, § único (limite adicional para propostas que financiem
    procedimentos do ATE); art. 32 (funcional 2E90, GND 3, modalidade 31, até
    seis parcelas)."
  o_que_mudou_no_plano_final:
    - "SUMÁRIO — 'Quatro características' virou cinco. Nova: 'O programa federal
      é base, e não é a fonte do pagamento.'"
    - "1.3 — saiu a linha da ação 8585/PO 0005 FAEC. Entraram 'Modalidade da
      transferência' (Incremento MAC, art. 24) e 'Relação com o FAEC' (nenhuma,
      no pagamento). A linha da funcional programática foi ajustada."
    - "2.2 — REESCRITA INTEIRA. Diagrama novo: FNS --Incremento MAC--> FSDF
      --convênio--> executor, e a APAC pendurada como comprovação, sem pagamento
      federal atrelado. Três blocos novos: 'O FAEC não entra nesta cadeia',
      'O programa é base, não é caixa', 'A tensão que isso abre, dita por
      inteiro' (segregação é ato da SES-DF)."
    - "2.3 — parágrafo novo: a duplicidade tem duas faces, registro e custeio."
    - "3.6/teto PMAE — reescrito. Os 20,1% do envelope do DF deixam de ser
      questão financeira: o teto da NT 2/2025 limita o financiamento por
      produção, que não custeia isto. Sobra como argumento de ESCALA, para o
      Grupo Condutor do PAR. O limite que vincula é o MAC do art. 23."
    - "5 (intro) — 'financiável' virou 'registrável e comprovável'."
    - "5.1 — 'condição de faturar' virou 'condição de registrar'; a cadeia foi
      explicitada (norma exige APAC, APAC exige 38.01, 38.01 exige PAR) e
      acrescentado o bloco 'O que não se sabe, e é pergunta à concedente':
      a NT 3/2025 condiciona ao PAR a execução 'com devido financiamento
      federal'. Adotada a leitura conservadora."
    - "5.2 — retitulada 'InvestSUS — dois trâmites que não se confundem'. O que
      vale para esta emenda é o art. 24 da 10.297; o item 5.1 da NT 3/2025 é do
      circuito ordinário."
    - "5.3 — a FPO deixa de ser teto de FATURAMENTO e passa a teto de REGISTRO;
      acrescentada a pergunta de segregação."
    - "Meta 2 — 'em condição de operar e de faturar' virou 'de registrar'."
    - "6.4 — BPA-I por fora do FAEC: aqui não significa pagamento nenhum."
    - "9.2 — subetapas 1.1 e 1.7 reescritas."
    - "11.2 — a imutabilidade do valor de R$ 200,00 passa a ser CLÁUSULA
      CONTRATUAL adotada, não imposição federal: a NT 1/2025, item 2.1.6, rege o
      faturamento ao financiamento federal. Espelhado em 2.1."
    - "15.2 — a APAC não serve mais ao ressarcimento; é comprovação. A
      conciliação ganha razão de ser, não perde."
    - "19.3/19.4 — R-18 REQUALIFICADO: era 'teto do PMAE não comportar o
      ressarcimento FAEC' (financiamento), virou 'produção custeada por emenda
      apresentada também ao FAEC — duplicidade de financiamento federal'
      (regulatório). R-01 e R-10 ajustados."
    - "19.5 — o duplo pagamento eliminado passa a ser explicitamente 'ao
      EXECUTOR'; acrescentado 'Estouro do teto PMAE do DF' como risco extinto."
    - "20 — linhas da 10.297/2026, da 3.492/2024, da 1.640/2024 e da NT 3/2025
      requalificadas."
  lacunas_novas:
    - "LC-077 — sistema e instância de autorização da APAC no DF (o usuário
      falou em 'APAC SAS' e pediu para conferir se é o da SES-DF). NÃO
      CONFERIDO nesta sessão."
    - "LC-078 — como a SES-DF segrega, na apresentação ao MS, a produção
      custeada por emenda da apresentada ao FAEC. Virou R-18."
    - "LC-079 — se PAR e habilitação 38.01 continuam exigidos para executor cuja
      produção não vai ao FAEC. Usuário: 'não sei te dizer'. Plano adotou a
      leitura conservadora (exigir os dois)."
    - "LC-080 — se a SES-DF exige, ainda assim, a inclusão deste executor na
      relação do item 5.1 da NT 3/2025."
    - "LC-081 — CNES a informar no InvestSUS (art. 24, III) e situação da
      proposta."
  nao_verificado: "Nenhuma das normas foi lida no original nesta sessão além dos
    trechos extraídos em extraidos_normas/. Os arts. 23, 24 e 27 da 10.297/2026
    foram lidos no texto extraído (páginas 5 a 7)."

# ---------------------------------------------------------------------------
# MÉTODO DA PLANILHA — 2026-08-20, orientação do usuário. NÃO APLICADO ao final.
# ---------------------------------------------------------------------------
metodo_da_planilha:
  orientacao: "Montar de baixo para cima, pelo fluxo do atendimento, pensando em
    três setores: administrativo, financeiro e técnico — este último já muitas
    vezes contemplado dentro da OCI. Exemplo dado: precisa ter secretaria,
    precisa ter alguém para lançar no sistema, precisa ter alguém do TI."
  escopo: "EXPLICITAMENTE para o futuro. O usuário disse: 'não precisa alterar o
    plano final, apenas ajustar a abordagem'. A Seção 11 do plano_final.md
    permanece organizada por natureza de despesa (R1 a R6)."
  registrado_em: "destilados/roteiro.md, Seção 5 — bloco 'Como se monta: de baixo
    para cima, pelo fluxo do atendimento', quadro dos três setores, três critérios
    de aceite novos e uma segunda armadilha."
  o_que_o_plano_atual_ja_faz_certo: "R2 lista os postos por função do fluxo
    (recepção, agendamento, busca ativa, faturamento/APAC), e 11.3 já veda que
    item assistencial reapareça no apoio. O que falta, pelo método novo, é a
    DERIVAÇÃO: os postos estão em 2/polo e 1/polo redondos, sem amarração
    declarada ao volume do passo que os exige."
  a_decidir_quando_aplicar: "Onde cai o TI na tripartição — administrativo ou
    técnico. Importa porque decide se o custo é do apoio ou se já está no valor
    unitário. No exemplo do usuário o TI aparece como posto do fluxo, logo
    planilha; a etiqueta ficou em aberto."
