# Lacunas bloqueantes — não impedem redigir, impedem fechar.
bloqueantes:
  - id: BL-001
    secao: 13
    descricao: "Base legal do instrumento."
    fase: 2
    status: encerrada
    resolucao: "Premissa do exercício: a SES-DF não executa por MROSC, salvo
      exceções na atenção primária; o instrumento é convênio. Quando roda MROSC,
      é objeto de PAP, nunca de MAC, e em geral vai para outras pastas (esporte,
      mulher). Logo a Lei 13.019/2014 não é a espinha: art. 199 §1º CF, Lei
      8.080/90 e camada distrital (Decreto DF 37.843/2016, art. 33 — AC-010).
      Situação atual da secretaria, pode mudar. Normas cadastradas em
      2026-08-17: NM-001 a NM-007 no acervo, OB-001 a OB-010 nas obrigações."

  - id: BL-002
    secao: 1
    descricao: "Duplo pagamento entre FAEC e convênio."
    fase: 3
    status: encerrada
    resolucao: "O fluxo é cadeia, não duplicidade: MS repassa ao Fundo de Saúde
      do DF, e a SES paga o executor por meio do convênio. O executor é
      remunerado uma vez. Desenho (c) confirmado. Resta LC-012, não bloqueante:
      se a produção custeada por emenda também gera reembolso FAEC ao Fundo,
      é contabilidade do Fundo, não do convênio."
    revisao_2026_08_20: "SUPERADA EM PARTE pelo bloco fonte_nao_e_faec, abaixo.
      O usuário informou que, vindo o recurso de emenda, NÃO há pagamento por
      FAEC — o Agora Tem Especialistas entra só como BASE. LC-012 deixa de ser
      'contabilidade do Fundo' e vira questão de segregação: se a mesma produção
      for apresentada ao FAEC, há duplicidade de financiamento federal do lado do
      ente. Virou o risco R-18, requalificado."

  - id: BL-003
    secao: 13
    descricao: "O Decreto DF 37.843/2016 é decreto de PARCERIA (MROSC), e o plano
      o usa como camada distrital enquanto nega que o MROSC reja o instrumento."
    fase: 2
    status: resolvida_em_parte
    aberta_em: 2026-08-17
    resolvida_em_parte: "2026-08-18 — a norma do convênio é a PORTARIA DE
      CONSOLIDAÇÃO GM/MS Nº 1/2017 (NM-008), informada pelo usuário. O Decreto DF
      37.843/2016 sai da posição de norma do instrumento e a contradição central
      se dissolve. RESTA: (a) localizar anexo e artigo na PRC 1/2017, não lida no
      original; (b) a CAMADA DISTRITAL fica vazia — LC-044, DV-025."
    origem: "Texto do decreto fornecido pelo usuário. Vocabulário inteiramente
      MROSC: 'organização da sociedade civil', 'termo de colaboração ou de
      fomento', 'parceria', 'edital', 'chamamento'. Art. 28 trata do plano de
      trabalho da parceria; art. 35 fala em inadimplemento da OSC; art. 36 diz
      que os recursos não são pagamento por prestação de serviços."
    a_contradicao: "BL-001 fixou que a SES-DF não executa por MROSC e que o
      instrumento é convênio em participação complementar (art. 199 §1º CF, Lei
      8.080/90), com a camada distrital sendo o Decreto 37.843/2016, art. 33 —
      pista herdada do pt_ses_01 (AC-010). As duas coisas não podem valer juntas:
      ou o regime é de parceria, e a Lei 13.019/2014 volta a ser espinha; ou é
      convênio, e ESTE decreto não é a norma aplicável."
    o_que_cai_se_for_convenio:
      - "OB-006 e OB-015: a âncora do desembolso antecipado. A leitura de AC-032
        continua plausível, mas perde o dispositivo."
      - "OB-017: a âncora do degrau 3 da escada da Seção 7 (retenção de parcela)."
      - "OB-016: conta específica e aplicação financeira obrigatória."
      - "OB-014: o método de pesquisa de preços que fecharia LC-023."
      - "A camada distrital da Seção 13 fica vazia, e é justamente a armadilha
        nomeada no roteiro — citar a federal e esquecer a distrital."
    o_que_cai_se_for_parceria:
      - "A premissa de BL-001 e a redação da Seção 13."
      - "O instrumento deixa de ser convênio e passa a termo de colaboração ou
        de fomento, com chamamento público."
      - "Art. 36: os recursos não são pagamento por prestação de serviços — o que
        colide com a rubrica R1 escrita como 35.000 x R$ 200,00."
    dado_do_corpus: "AC-045, levantado em 2026-08-17: A MISTURA NÃO É DESTE
      RASCUNHO, foi herdada de plano aprovado. Contagens (01/02/03/04):
      'organização da sociedade civil' 17/2/2/1; 'OSC' 37/1/1/1; 'parceria'
      0/3/3/3; 'convênio' 31/8/8/7; 'termo de colaboração' e 'chamamento' zero
      nos quatro. O pt_ses_01 chama o instrumento de convênio 31 vezes, a
      entidade de OSC 37 vezes, e parafraseia o art. 33 como 'vedada a
      antecipação em desacordo com a natureza do objeto DO CONVÊNIO'. O corpus
      não resolve BL-003 — ele é a evidência dela. Nenhum dos quatro menciona
      termo de colaboração, termo de fomento ou chamamento público, o que
      enfraquece a leitura de que o regime praticado seja o de parceria."
    como_resolver: "Confirmar a ementa e o âmbito do Decreto 37.843/2016 no
      SINJ-DF, e localizar a norma distrital que rege CONVÊNIOS fora do MROSC —
      provavelmente nas normas de execução orçamentária e financeira do DF, a
      identificar. Pergunta ao professor: DV-025."
    nao_bloqueia: "A redação das Seções 1 a 12. Bloqueia FECHAR a 13, e muda o
      fundamento das Seções 5, 6, 7 e 8."

# Decisões tomadas, para não reabrir
decisoes:
  - "VIGÊNCIA DE 10 MESES (revista em 2026-08-17, era 9). Pré-produção de 2
    semanas + 9 meses de janela assistencial. Alinha com o corpus, que compra o
    tempo de partida esticando a vigência (AC-034, AC-035), em vez de encolher a
    janela. Custo: perde-se a comparação direta de intensidade com o pt_ses_01.
    Ganho: entradas caem de 5.000 para 4.125/mês e a carga por polo de ~159 para
    ~131 consultas/dia útil. M-16 incorporada ao plano."
  - "Polo de execução separado de região de referência: 3 polos executam, 7
    Regiões de Saúde são referenciadas, como no pt_ses_01 (AC-021)."
  - "Desenho (c) — produção + apoio — confirmado pelo fluxo de BL-002."
  - "OCI de entrada 09.02.01.002-6 — Avaliação Cardiológica — R$ 200,00
    (comp. 04/2026), Portaria SAES/MS 1.822/2024. Não confundir com
    09.02.01.004-2, que o pt_ses_04 rotulou errado (AC-017)."
  - "Meta = 35.000. Rendimento realista dos 36.052 CNS a 20% de absenteísmo,
    com reagendamento. O 70/30 exato é consequência, não a causa."
  - "3 polos, desenho B: dois no eixo Sudoeste/Oeste (Taguatinga e Samambaia ou
    Ceilândia), um em Sobradinho para Norte/Leste. Sudoeste+Oeste concentra 49%
    da demanda pela chave do pt_ses_01 (AC-021). Volumes pendem de LC-003."
  - "Fonte federal: produção remunerada estritamente a R$ 200,00, sem incremento
    sobre o procedimento. A rubrica de apoio custeia só o não assistencial,
    pelo argumento do pt_ses_01 (AC-009) — leitura do corpus, adotada."
  - "Nível do rascunho: mínimo viável. Melhorias vão para redacao/melhorias.md
    e NÃO entram no plano_atual."
  - "DESEMBOLSO ANTECIPADO. Convênio não é pagamento por produção: o recurso é
    liberado contra cronograma, antes da despesa, e conciliado na prestação de
    contas (AC-032). A 1ª parcela custeia a partida do contrato — é por isso que
    não há contrapartida. O risco migra do repasse para a devolução."
  - "OCI concluída = fluxo completo até a consulta de retorno. Sem retorno, sem
    pagamento. Execução física inteira dentro dos 9 meses; pagamento depois."
  - "Vigência física (9 meses, até o último retorno) separada de vigência
    financeira (pagamento e prestação de contas, posterior) — ver DV-012."
  - "Seção 2: três metas. Meta 1 = 35.000 OCI CONCLUÍDAS (unidade da meta),
    desdobrada em 1.1 a 1.3 por polo — volumes em LC-003. Meta 2 = 87.500 vagas
    de consulta ofertadas (43.750 entrada + 43.750 retorno). Meta 3 = 3 polos em
    operação, Etapa 0. Só a Meta 1 soma ao quantitativo do objeto; as demais
    estão em outra unidade."
  - "A 1ª parcela se vincula à Meta 3 (implantação com entregas verificáveis:
    equipe contratada, agenda no SISREG, FPO programada), nunca à Meta 1 —
    nenhuma OCI estará concluída no mês 1."
  - "CICLO DA OCI = 30 DIAS. Prazo entre a consulta de entrada e o retorno com
    exames prontos, informado pelo usuário em 2026-08-17 como factível. Vira
    PARÂMETRO PACTUADO, não observação (DV-011, respondida)."
  - "CURVA MENSAL FECHADA (LC-013). Implantação no mês 1; entradas nos meses 2 a
    8 (5.000/mês); conclusões nos meses 3 a 9 (5.000/mês); vagas 6.250 por ponta
    por mês, 12.500 nos meses 3 a 8. Totais: 35.000 entradas, 35.000 conclusões,
    87.500 vagas. Implantação de 1 mês é PREMISSA DECLARADA (LC-015) — se
    passar disso, a curva inteira desloca."
  - "Consequências da curva: (a) primeira competência com produção é o mês 3, as
    duas primeiras parcelas não têm conclusão para conciliar — Seção 6; (b) nos
    meses 3 a 8 cada polo faz ~1.667 entradas MAIS ~1.667 retornos, cerca de 159
    consultas por dia útil por polo — é esse o número da Seção 9, não 79;
    (c) faltoso do mês 8 não tem terceira chance dentro da vigência."
  - "Apuração da Meta 1 é mensal, por competência do SIA/SUS. Meta apurável só no
    último mês deixaria a prestação de contas mensal sem lastro."
  - "A META 1 É A RUBRICA DE PRODUÇÃO. 35.000 x R$ 200,00 = R$ 7.000.000,00 =
    70% do valor global. Os 30% de apoio NÃO compram OCI e não geram meta
    assistencial. Isso precisa estar explícito no plano — confirmado pelo
    usuário em 2026-08-17."
  - "NÃO EXISTE MEIA OCI. Só se recebe pela OCI concluída; não há pagamento
    proporcional por consulta, exame ou procedimento secundário isolado. OCI
    iniciada e não finalizada é custo sem contrapartida e deve ser evitada ao
    máximo (DV-013, respondida pelo usuário)."
  - "Tratamento do faltoso: reagendamento e BUSCA ATIVA do usuário, com os dados
    de contato que a SES-DF fornece para os pacientes regulados. É mecanismo de
    proteção da meta, não cortesia (DV-014, respondida em substância)."
  - "Recebimento antecipado para dar partida ao convênio: confirmado pelo
    usuário, além de AC-032. Sustenta a Meta 3 como lastro da 1ª parcela."
  - "CICLO DA OCI = 30 DIAS, e 30 é TETO. Tempo médio e mínimo menores, conforme
    a liberação dos resultados dos exames. Parâmetro pactuado, não observado
    (DV-011, respondida)."
  - "Retorno agendado já na consulta de entrada sempre que possível — é o que
    garante o recebimento. E OCI EM ANDAMENTO É PRIORIDADE sobre entrada nova.
    Regras operacionais com efeito financeiro; vão para as Seções 7 e 11."
  - "CURVA MENSAL FECHADA (Seção 2), vigência de 10 meses: pré-produção nas 2
    primeiras semanas; entradas de meia janela no mês 1 (2.000) e 4.125/mês nos
    meses 2 a 9; conclusões 2.000 no mês 2 e 4.125/mês nos meses 3 a 10. Mês 10
    é só conclusão. Carga ~131 consultas/dia útil por polo — número que
    dimensiona a Seção 9."
  - "DIVISÃO ENTRE POLOS POR MÉDIA ARITMÉTICA: 11.667 + 11.667 + 11.666 = 35.000.
    Provisória e declarada como tal — não pondera capacidade instalada, população
    nem fila. Refinamento vira M-15, não lacuna. LC-003 deixa de ser lacuna da
    Seção 2."
  - "MÊS 1 É SÓ IMPLANTAÇÃO, atendimento a partir do mês 2 — decisão do
    proponente. O corpus faz pré-produção de 2 SEMANAS (AC-034) e declara
    vigência 1 mês maior que o período assistencial (AC-035): compra o tempo de
    partida esticando a vigência, não encolhendo a janela. Como a vigência de 9
    está travada, a janela assistencial cai para 8. Alternativa registrada em
    M-16 (vigência 10)."
  - "OFERTA DE AGENDA NÃO É META. As 87.500 eram agendamentos (eventos), não
    pessoas nem vagas distintas — o teto de pessoas é a fila de 36.052 CNS. Vira
    dimensionamento da Seção 9 e monitoramento da Seção 7. A Meta 2 passa a ser
    os 3 polos em operação; o plano tem DUAS metas, não três."
  - "OCI CONCLUÍDA TEM DUAS PARTES: assistencial (retorno realizado) e documental
    (todos os formulários carregados nos sistemas de registro). Sem o registro, a
    OCI é clinicamente concluída e administrativamente inexistente. Amarra o
    prazo de carga na Seção 8 e reforça DV-012."
  - "ALERTA DE DIMENSIONAMENTO: 35.000 concluídas sobre 36.052 CNS = 97,1% da
    fila. Só fecha com busca ativa até a 3ª tentativa nos dois pontos e com todo
    mundo elegível e localizável. Alívio possível: fluxo de entrada de novos
    usuários na fila, não medido (LC-016 / DV-015). Vai nomeado na Seção 11."
  - "FLUXO DA OCI E DIVISÃO DE RESPONSABILIDADE: (1) executor libera horários;
    (2) SES-DF REGULA e agenda o usuário da fila; (3) consulta de entrada;
    (4) exames; (5) consulta ou teleconsulta de retorno; (6) carga dos
    formulários. A etapa 2 NÃO é do executor — ele oferta a vaga, a SES a
    preenche. Vaga ofertada e não regulada é capacidade ociosa. Vira indicador
    na Seção 3, risco na Seção 11 e LC-017/DV-016. O fluxo vale para quem JÁ ESTÁ
    NA FILA: o executor não capta, não seleciona e não recruta usuário."
  - "Seção 3: 3 indicadores PACTUADOS (IND-01 execução mensal, IND-02 cobertura
    acumulada, IND-03 implantação 3/3) e 5 de ACOMPANHAMENTO sem consequência
    contratual (IND-04 preenchimento das vagas reguladas, IND-05 comparecimento
