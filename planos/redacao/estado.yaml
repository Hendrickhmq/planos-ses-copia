# estado.yaml — onde a redação parou
#
# Escrito a cada seção fechada. Serve para retomar a conversa dias depois sem
# recontextualizar o projeto inteiro: quem retoma lê este arquivo, o roteiro.md
# e as seções já escritas — nunca as fichas nem os texto.md.

objeto_resumo: "35.000 OCI 09.02.01.002-6 (Avaliação Cardiológica) a R$ 200,00,
  para a fila regulada do SUS/DF. 3 polos, 10 meses, emenda federal de
  R$ 10.000.000,00 — R$ 7.000.000,00 produção (70%) e R$ 3.000.000,00 apoio.
  Agendamento dimensionado em ~87.500 horários (fator 1,25 em dois pontos do
  fluxo) — dimensionamento, não meta."
modo: "redacao_puxa_estudo"
nivel: "minimo_viavel"   # melhorias em redacao/melhorias.md, fora do rascunho
roteiro: "destilados/roteiro.md"

secao_atual: remontagem  # DOCUMENTO MONTADO em redacao/plano_final.md (18/08/2026)

