# Detalhe da DV-001, mantido aqui porque encadeia com BL-002
duvidas:
  - id: DV-001
    titulo: "Produção excedente à meta: quem paga, se é que alguém paga"
    secoes: [2, 5, 6, 8, 11]
    pergunta: "Se o executor produzir acima das 35.000 OCI pactuadas, o
      Ministério da Saúde remunera esse excedente por FAEC, ainda que o convênio
      não pague?"
    o_que_ja_se_sabe:
      - "O convênio NÃO paga. O pt_ses_01 traz cláusula vedando alteração do
        objeto, da finalidade das despesas e do valor global pactuado (AC-029).
        Além do valor global só com termo aditivo."
      - "O SIA valida a produção contra a FPO antes de aprovar. Produção acima do
        teto programado fica apresentada e não aprovada (AC-026, AC-028)."
      - "A FPO é programada a partir do que foi pactuado em convênio, com o
        quantitativo correspondente (AC-028)."
    desdobramento:
      - "(a) A FPO é programada no mesmo quantitativo da meta, ou acima dela?
        Se for igual, o excedente nem chega a ser aprovado — a pergunta morre
        na FPO, antes de chegar ao Ministério."
      - "(b) Se o excedente for aprovado, o recurso vai para o Fundo de Saúde do
        DF ou para o executor? Pelo fluxo de BL-002, o FAEC repassa ao Fundo, e
        quem paga o executor é a SES via convênio — que está limitado ao valor
        global. Então produção aprovada não implica executor remunerado."
      - "(c) Existe caminho pelo qual o executor receba direto do Ministério?
        Só se ele for prestador contratado/credenciado do SUS por outro
        instrumento, em paralelo ao convênio. Isso é outra relação jurídica e
        precisa ser confirmado."
    hipotese: "Provável que não haja pagamento do excedente: a FPO barra a
      aprovação e o convênio barra o repasse. Mas é hipótese, não resposta."
    como_resolver: "Perguntas 3 e 4 ao professor, mais leitura da FPO do
      estabelecimento e do art. 33 do Decreto DF 37.843/2016."
    status: aberta

  - id: DV-002
    titulo: "Quando uma OCI está concluída"
    secoes: [2, 3, 8]
    status: respondida
    resposta: "A OCI conclui quando o usuário completa o fluxo inteiro, até a
      consulta de retorno. Sem retorno, não há pagamento."
    consequencias:
      - "A unidade da meta é OCI CONCLUÍDA, não atendimento realizado."
      - "Dois pontos de absenteísmo, entrada e retorno. Vagas de consulta a
        ofertar = 87.500, não 43.750."
      - "A janela de entrada é menor que a vigência: a última OCI precisa
        começar com um ciclo de folga. Ver DV-011."
      - "A 1ª parcela não pode se vincular a OCI concluída no mês 1."
      - "Teleconsulta de retorno vira alavanca operacional — a OCI admite
        'consulta ou teleconsulta de retorno', e teleconsulta tem menos falta."

