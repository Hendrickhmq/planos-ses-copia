    nota: >
      Distribuir custou 1 posto: 8 nos polos contra 7 que a mesma carga exigiria numa
      central unica, porque o arredondamento para cima acontece tres vezes em vez de
      uma. Coube assim mesmo - 8,45% contra teto de 8,5%.

  duplicidade_do_assistente_de_polo_02_09_2026:
    pergunta_do_usuario: "O que seria um assistente de polo?"
    o_que_ela_achou: >
      O posto que eu criei fazia "acolhimento, conferencia de jejum e acompanhante,
      ficha e termo" - e a secao 5.4 ja dizia que quem faz isso e "a recepcao do polo",
      que a secao 5.12 declara DENTRO dos 600,11. Cinco postos, R$ 160.000, fazendo o
      que o plano afirmava estar pago no valor unitario. E a duplicidade de custeio que
      a propria 5.12 existe para impedir - e teria sido achado de parecer.
    correcao: >
      Sem mudar valor: o posto passou a ser "Assistente de polo - conferencia e
      documentacao da OCI" e a fronteira ficou escrita nos tres lugares. A recepcao do
      polo faz identificacao e documentacao de rotina de TODOS os usuarios do servico,
      dentro do unitario. O assistente do convenio faz o que a OCI exige alem disso:
      confere o comparecimento contra a lista do dia, o jejum e o acompanhante
      (art. 12 da RDC 6/2013, verificacao que decide se o exame acontece e que aciona
      a busca ativa), colhe o termo, abre a ficha da OCI e confere a completude do
      conjunto antes do lancamento. Controle documental do convenio, nao atendimento.
    licao: >
      Posto novo na planilha obriga a procurar quem ja fazia aquilo no texto. A busca e
      por VERBO, nao por nome do posto: "confere", "colhe", "acolhe". Nenhuma das 18
      verificacoes pega isso - a delimitacao de 5.12 e prosa contra prosa.

  nomes_dos_postos_alinhados_ao_acervo_02_09_2026:
    pedido: "Nao conseguimos deixar um outro nome? Algo mais parecido com o que tem nos outros"
    fonte: "normalizados/*/planilha.csv, coluna DESCRICAO dos cinco aprovados"
    trocas:
      - "'Assistente de polo - conferencia e documentacao da OCI' -> **Recepcionista**.
         E o nome do acervo em tres dos cinco: pt_ses_01 (4 x 4.155), pt_ses_02
         (16 x 3.200) e pt_ses_03 (6 x 3.200). Nosso preco, 3.200, e o mesmo do 02 e 03"
      - "'Operador de registro e APAC' -> **Operador de registro de sistemas**, nome e
         preco identicos ao pt_ses_02 (15 x 4.300)"
      - "'Coordenacao de Execucao' -> **Coordenacao Administrativa, Financeira e
         Assistencial**, composta dos dois nomes do pt_ses_01, que e de onde vem o
         preco de 10.500"
    consequencia_boa: >
      O achado de duplicidade da rodada anterior se dissolve. Eu tinha declarado em
      5.12 que "recepcao do polo" estava dentro dos 600,11 e criado um posto que fazia
      a mesma coisa. O acervo mostra que a pratica aprovada e OUTRA: o pt_ses_02 e plano
      de OCI, compra OCI a 100/140/360 E custeia 16 recepcionistas na planilha. Entao a
      recepcao saiu da lista do que esta dentro do unitario, o posto voltou a se chamar
      Recepcionista e 5.4 tem um ator so. Nenhum valor mudou.
    licao: >
      Antes de inventar nome de posto, ler a coluna DESCRICAO dos aprovados. O acervo
      ja nomeou quase tudo, e nome reconhecivel e meio caminho da aprovacao.

