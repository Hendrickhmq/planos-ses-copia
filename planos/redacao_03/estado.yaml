revisao_do_padrao:
  data: 2026-09-02
  o_que: "auditoria do PADRAO.md contra o que as ferramentas de fato fazem"
  achados:
    - "SECAO 5.2 DESATUALIZADA E ERRADA, apontado pelo usuario em 02/09/2026. Quatro defeitos: (a) 2.3 dizia que o ultimo procedimento e 'a teleconsulta de retorno', contradizendo o proprio paragrafo acima, que ja dizia 'consulta OU teleconsulta'; (b) a APAC abre na CONSULTA, nao no exame - art. 15 da 1.640/2024; (c) o paragrafo dizia 'preferencialmente na primeira quinzena' e fechava com 'e regra e nao preferencia', contradicao literal, alem de voz retorica; (d) o grave: a segunda quinzena era reservada aos casos 'em que nao se antecipa indicacao de biopsia', mas a indicacao se decide DURANTE o exame - triagem inexecutavel, resquicio de quando o anatomopatologico era obrigatorio. Reescrita: a agenda e montada para o caso mais longo, todos na primeira quinzena, e o excedente vai para o rastreamento prioritario da 5.7. Dias conferidos: 54 a 57 no dia 5, 31 a 34 no dia 28"
    - "Nasceu dai a regra 7 do PADRAO.md: decisao que muda premissa obriga varredura do documento inteiro
    - "REGRA 2 ESTAVA ERRADA: eu havia escrito 'a meta se arredonda para baixo - 13.000, nao 13.005'. O usuario corrigiu em 02/09/2026: o arredondamento e ARITMETICO, nao estetico - a meta e o PISO de (verba - custo acessorio) / unitario, porque nao se atende fracao de pessoa. Arredondar 13.005 para 13.000 descartava 5 OCI de producao por cosmetica. Plano refeito a partir do piso: 13.005 OCI, sobra R$ 19,45. A verificacao C perdeu a valvula de escape do 'arredondamento declarado' e voltou a exigir sobra menor que um unitario"
    - "duas referencias cruzadas quebradas: fase 1 apontava a secao 6 (justificativa) em vez da 8 (ancoragem); regra 4 apontava a 5 (voz) em vez da 7 (citacao). CORRIGIDAS"
    - "o contrato do estado.yaml na secao 11 divergia do codigo nos dois sentidos: pedia vigencia_meses e meses_producao, que ninguem le, e omitia objeto.oci (lido pela N) e os tres derivados lidos pela H. REESCRITO como tabela chave-por-verificacao"
    - "o padrao nomeava as tres metas e nao dizia o que cada uma carrega. ACRESCENTADO: descricao, quantitativo afericao e prazo, mais a meta qualitativa obrigatoria (art. 7o, III do Decreto DF 48.727/2026). P passou a conferir"
    - "as sete secoes de 'O que nao volta' nao eram verificadas por nada. J passou a barrar titulo de secao ou subsecao que reintroduza qualquer uma"
    - "a proporcao '3 achados reais para 9 defeitos do teste' na secao 10 estava defasada e virava numero fixo; reescrita como constatacao"
    - "aviso acrescentado no topo: a estrutura vale a do PADRAO.md, porque o 00_metodo.md guarda a antiga de 13 secoes e ja induziu o parser a erro"

conferencia:
  ferramenta: conferir_plano.py            # na raiz; roda em qualquer plano
  arnes: testar_conferencia_plano.py       # na raiz; mutacoes derivadas do plano
  padrao: PADRAO.md                        # o processo e a estrutura que ela confere
  comando: "python3 conferir_plano.py redacao_03/ && python3 testar_conferencia_plano.py redacao_03/"
  data: 2026-09-01
  verificacoes: 17              # A a Q; P e J passaram a cobrir mais
  resultado: "17/17 passaram"
  mutacoes_injetadas: 19
  mutacoes_apanhadas: 19
  rodada_de_ajustes_do_usuario: |
    01/09/2026, seis correcoes de uma vez:
    1. Economicidade saiu da secao 3 e virou 8.1 - o dinheiro todo no fim, antes da
       matriz de risco.
    2. Numeros redondos: meta de 13.052 para 13.000; rateio 5.050/5.050/2.900; curva
       600/1.200/1.600. O envelope comporta 13.005 e o plano DECLARA isso. A regra 2
       do PADRAO.md foi reescrita: meta redonda com sobra a vista e legitima; o que
       se proibe e fechar total mexendo em linha elastica. A verificacao C passou a
       exigir a declaracao do arredondamento em vez de proibir a sobra.
    3. Indicadores e meta qualitativa em 100%. "Nao faz sentido eu ter uma meta e
       querer chegar abaixo dela."
    4. Secao 5.2 reescrita - estava desatualizada.
    5. Pessoal no lugar de tecnologia: sairam sistema informatizado, suporte de TI,
       notebooks, impressora, internet e nuvem (R$ 104.800) e entraram assistente
       administrativo por polo (3 x 3.200 x 10) e assessoria de prestacao de contas
       (3.700 x 10). 99,5% do apoio virou pessoal. Regra: quando o acessorio e baixo
       e a escolha e entre RH e infraestrutura tecnologica, escolher RH - mais facil
       de justificar e de receber.
    6. O paragrafo dos polos em 2.5 foi encurtado.
    Fechamento: apoio 695.520,00 - meta 13.000 - global 8.496.950,00 - sobra 3.050,00
    - apoio/global 8,19%.
  poda_de_voz: |
    Usuario, 01/09/2026, com dois exemplos: "O mes 10 nao e folga, isso nao pode ser
    aceito jamais" e "A distincao entre obrigatorio e opcional nao e nossa, essas
    coisas nao cabem num plano de trabalho". Diagnostico: o plano se defendia em vez
    de declarar. Varredura achou 24 frases em quatro classes - negacao defensiva,
    meta-comentario sobre o proprio documento, enfase retorica e confissao. Todas
    corrigidas; restaram apenas negacoes DECLARATIVAS, que afirmam o que se faz.
    Virou a secao 5 do PADRAO.md e a verificacao Q.
    Mesma conversa: a justificativa quando ha fila. O usuario: "a maioria dos nossos
    planos vao trabalhar em cima de filas ja existentes e com demanda comprovada,
    nao precisamos ficar procurando justificativas". A secao 3 foi reescrita em
    torno da fila do Mapa Social; a subsecao de literatura (estadiamento ao
    diagnostico, Lei dos 60 dias, incidencia INCA) foi cortada inteira. Secao 3
    passou de 7 para 5 subsecoes. Virou a secao 6 do PADRAO.md.
    Plano de 8.493 para 7.777 palavras.
  poda_normativa: |
    Usuario, 01/09/2026: "seria bom dar uma diminuida em citar normas, nao agrega
    nada para a gente so faz com que tenhamos mais obrigacao". Criterio aplicado:
    citacao que DA UM NUMERO ou PROTEGE fica; citacao que so entrega ao analista a
    regua para nos medir sai, e o conteudo operacional permanece descrito.
    SAIRAM: RDC ANVISA 6/2013 (13 mencoes), Resolucao CFM 2.174/2017 (2),
    Lei 13.709/LGPD (1), Portaria GM/MS 3.492/2024 (1), IN CGDF 01/2005 (1, com a
    declaracao de nao-mora, que e peca do processo e nao do plano), e as ancoras
    do Decreto DF 48.727 nos arts. 7 III, 16-18, 18 e 30.
    FICARAM: SAES 4.653 (valor e composicao), SAES 1.640 (conclusao da APAC e as
    2 competencias), NT 1/2025 e NT 3/2025 (anatomopatologico opcional - protege),
    NT 2/2025 (sem faixa etaria - protege), SAES 4.282 (economicidade),
    Lei 12.732 (argumento da justificativa), Decreto DF 48.727 art. 33 §2
    (sem a lista de subcontratadas, o que nao consta e vedado - protege).
    Segunda passada (mesma data): a SAES 1.640 caiu de 3 mencoes para 1, ficando
    so na secao 2.3, onde define a unidade de afericao. Na 3.1 a definicao de OCI
    virou prosa; na 5.13 o registro remete a 2.3.
    Terceira passada: a NT 1/2025 caiu de 3 mencoes para 1. As duas protecoes que
    ela dava - anatomopatologico opcional com valor invariavel (itens 2.1.5 e
    2.1.6) e alternancia consulta/teleconsulta (item 2.1.10) - foram concentradas
    na secao 2.2; a 5.7 e a 5.8 remetem a ela.
    De 12 normas / ~35 mencoes para 8 / 12. Plano de 8.862 para 8.190 palavras.
    Sete das oito aparecem uma unica vez; so a SAES 4.653 repete, e e a que
    sustenta preco, composicao e compatibilidade da sedacao.
    Medido no acervo: ISHP cita DUAS normas em todo o documento (Lei 8.080 sem
    artigo, na justificativa; Decreto 37.843/2016 art. 33, no desembolso); IEV
    cita ZERO leis e decretos, so as portarias de OCI como subtitulo de eixo.
  achados_reais_4: |
    Usuario, 01/09/2026: "pode cortar a 1.3" e "sobre a estrutura ela nao tem que
    seguir uma ordem que ja tinhamos definido antes? nao invente moda faca o que
    ja funciona". Secao 1.3 Fundamentacao CORTADA - era o unico acrescimo
    estrutural nosso. Saem com ela, por serem orfas, o art. 199 §1o da CF, o
    art. 24 §unico da Lei 8.080 e a Portaria GM/MS 10.297; a IN CGDF 01/2005
    sobrevive na secao 4.2 e o Decreto DF 48.727 em 5.14, 5.15, 7.1 e 7.3.
    A verificacao J deixou de ter a ordem em copia hardcoded e passou a LER a
    ESTRUTURA PADRAO de redacao_02/00_metodo.md, secao "A ESTRUTURA PADRAO - 9
    secoes". Confere titulo a titulo e checa a ordem interna da secao 5
    (fluxo -> equipe -> metas -> indicadores). Os 9 titulos batem exatamente.
  achados_reais_3: |
    Perguntado se o plano todo segue o modelo dos aprovados (01/09/2026), medi
    secao a secao contra os dois esqueletos atestados. As 9 secoes tem
    contrapartida nos dois modelos. Dois desvios encontrados:
    (a) a secao 5.15 declarava TRES metas e a planilha orcava DUAS - Meta 3 sem
    dotacao. O ISHP tem Meta 03 com rubrica propria (Etapa 3.1 - Gestao
    Administrativa, Monitoramento e Pos-Execucao; item 3.1.1 Assessoria de
    Prestacao de Contas: R$ 187.095 no pt_ses_01 e R$ 29.600 no pt_ses_05); o IEV
    so tem Meta 01 e 02. Como o nosso texto declarava tres, a planilha foi
    dividida em tres: Meta 1 R$ 626.350,00, Meta 2 R$ 7.832.635,72, Meta 3
    R$ 41.000,00 (assistente financeiro + nuvem). Total inalterado. Nasceu dai a
    verificacao P.
    (b) a secao 1.3 Fundamentacao nao existe em nenhum dos cinco - unico acrescimo
    estrutural nosso, mantido por decisao a confirmar com o usuario.
  achados_reais_2: |
    Secao 1.1 repetia CNPJ, endereco, representante legal e qualificacao, que ja
    estavam na secao 4.1 - apontado pelo usuario em 01/09/2026. Consertei na
    direcao ERRADA: tirei os campos da secao 1 e deixei so na 4. O usuario
    perguntou se nos aprovados a identificacao nao vinha antes, e vinha: os cinco
    abrem por quadro cadastral tabular (ISHP "DADOS E INFORMACOES DA OSC"; IEV
    "1. DADOS CADASTRAIS DO PROPONENTE") e trazem depois "APRESENTACAO DO
    PROPONENTE" em texto NARRATIVO, nao em segunda tabela. Refeito assim:
    1.1 Dados cadastrais do proponente (quadro completo), 1.2 Dados do
    instrumento, 1.3 Fundamentacao; secao 4.1 virou narrativa. Nenhum dos cinco
    traz natureza juridica como campo de tabela - e declarada no texto; e o CNES
    nao aparece no quadro inicial. Nasceu dai a verificacao O.
  achado_real: "titulo 3.3 anunciava argumento ('O que o atraso produz') e violava a regra dos sintagmas nominais - renomeado para 'Estadiamento ao diagnostico e tempo de tratamento'"
  notebooklm:
    data: 2026-09-01
    fonte_subida: "PLANO EM CONFERENCIA — redacao_03 (OCI endoscopia)"
    consultas: [C1, C3, C2, C4]
    achado_maior: |
      TETO MAC (C4, artigo corrigido na fonte): Portaria GM/MS 10.297/2026, art. 23,
      I, alinea "e" - para entidade privada sem fins lucrativos cadastrada no CNES o
      limite corresponde a ate 100% da producao aprovada em MAC da unidade apurada em
      2025 (SIA e SIH); o art. 22 manda a SAES divulgar no portal do FNS. Se a
      producao de 2025 do proponente for inferior a R$ 8.499.985,72, o convenio
      inteiro se redimensiona. Entrou como condicao de partida em 4.2 e como secao
      B-bis de pendencias.md. A C4 citara o art. 36, que trata de frota do SAMU.
    c2_v2: |
      Reformulada com restricao por source_ids aos cinco aprovados: transcricao
      coerente, sem confabular sobre o nosso plano. MAS errou valores - deu
      assistente a 4.300 e recepcionista a 3.000; a extracao local mostra 3.200
      para os dois, confirmando os nossos precos. Regra: C2 serve para estrutura e
      inventario de itens, nunca para valor. Preco se le de
      normalizados/<plano>/planilha.csv.
      Achados incorporados: R-11 (indisponibilidade de medico endoscopista - os dois
      planos do ISHP trazem risco equivalente) e R-12 (acesso indevido a dado de
      paciente - os tres do IEV trazem). R-08 ampliado para cobrir tambem
      indisponibilidade de sistema DA CONCEDENTE.
      Nao incorporados, por serem exclusoes deliberadas ja documentadas: recepcao,
      limpeza, vigilancia, energia, agua, locacao de imovel, estoquista, assistente
      social, psicologo, comunicacao institucional.
    c2_v1_inutilizavel: |
      A C2 voltou sem sources_used e confabulou o conteudo do nosso plano em 11 de 15
      pontos verificados por grep: inventou dirigente (o do IEV), 6 parcelas
      bimestrais, riscos ate R-12, indicadores ate I-08, secao de fundamentacao
      juridica ja cortada, citacao de CFM 2.410/2024 e cronograma M01-M12. Nada foi
      incorporado. A consulta foi reformulada em conferencia_notebooklm.md: ele
      transcreve os aprovados, a comparacao e nossa, por grep.
    c4_defasada: |
      A C4 leu o instantaneo anterior as correcoes da C1 e apontou como defeito a
      subcontratacao e o CNS, ja consertados. Reforcada a regra de re-subir o
      plano.md antes de cada rodada.
    achados_confirmados:
      - "CPF OBRIGATORIO: a Portaria SAES/MS 2.747/2025, art. 1o, deu nova redacao ao art. 14 da 1.640/2024 - 'obrigatoriamente por meio do CPF'. O plano reproduzia a redacao anterior. CORRIGIDO em 5.13"
      - "TELECONSULTA marcada como obrigatoria na tabela 2.2; o obrigatorio e o RETORNO, em consulta OU teleconsulta. CORRIGIDO em 2.2 e 2.3"
      - "CONTRADICAO INTERNA entre 5.5 (conducao pelo endoscopista) e 5.11/5.12 (medico responsavel pela sedacao como posto distinto). CORRIGIDO: e o mesmo medico na sedacao consciente"
      - "SUBCONTRATACAO: art. 33 do Decreto DF 48.727/2026 admite subcontratar so atividade ACESSORIA. O plano dizia polos 'do proponente ou por ele contratados' e listava servicos medicos como subcontratacao. CORRIGIDO: polos sao capacidade instalada do proponente, equipe propria (art. 33 §4o), e a lista de terceiros ficou so com acessorias"
      - "NGC ausente: o art. 7o da 1.640/2024 exige Nucleo de Gestao do Cuidado cadastrado no CNES (servico 170, classificacao 002). ACRESCENTADO as condicoes de partida"
      - "SISCAN ausente: art. 13 §4o da 1.640/2024 manda manter o registro no SISCAN dos procedimentos de monitoramento do cancer. ACRESCENTADO em 5.13"
    nao_incorporados:
      - "quinto digito 7, carater eletivo, tipo de APAC 3-Unica, regra 0011: detalhe de preenchimento que nenhum aprovado descreve - incorporar seria assumir obrigacao voluntaria"
      - "programacao na FPO: ato do gestor, nao do convenente (teste do leitor, pergunta 2)"
      - "lista dos motivos de saida: nao muda nada no plano"
      - "afirmacoes 'sem lastro' apontadas pelo NotebookLM (15 dias, coeficientes de tempo, papel, +-15%, 95%): sao dimensionamento nosso, e o plano nao as apresenta como norma"
    licao_de_metodo: |
      A C1 voltou SEM sources_used e eu tratei o achado do CPF como falso positivo
      depois de grep no texto.md da 2.747/2025 - que traz anexada a redacao ANTIGA
      do art. 14. O artigo alterador estava em tabelas/p001_t01.csv. A C3 voltou COM
      citacao e me corrigiu. Regra nova no PADRAO.md, secao 6: conferir tambem
      extraidos_normas/<norma>/tabelas/*.csv, nao so o texto.md.

  defeito_apanhado_pela_H: |
      A mutacao H passou batido depois que escrevi no estado.yaml uma frase citando
