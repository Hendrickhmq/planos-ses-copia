conferencia:
  conferir_plano: "21 passaram, 2 NAO SE APLICA (I fila externa, V ficha dispensada), 0 FALHOU - 17/09/2026"
  testar_conferencia_plano: |
    RODA, mas nao esta em 100%: 4 residuos, todos em verificacao anterior a este plano.
      - R.2 nao se prende ao rotulo 'exame' e deixa passar quantidade de prosa alterada
      - T nao trata 'meses' como unidade, entao numero por extenso em meses passa
      - T deixou passar minuto alterado em prosa e percentual injetado em celula
    Os quatro sao gaps de R e T, nao da adaptacao multi-codigo: o plano 3 segue 22/22 e 27/27.
    PADRAO.md secao 10 exige as duas locais em 100% antes de entregar - esta e a pendencia.
  notebooklm: nao_rodada
  ferramenta_adaptada: |
    conferir_plano.py ganhou modo de multiplos codigos em 17/09/2026, guardado para nao
    alterar o plano 3 (que segue em 22/22 e 27/27 no harness):
      - carregar_parametros le valor_unitario.por_codigo, metas_execucao e direcao
      - etapas_da_planilha fecha etapa tambem no TOTAL DA META
      - metas_planilha le linha a linha e toma o ultimo valor monetario
      - B confere as metas de execucao pela soma das etapas
      - C inverte quando direcao = fila_define_recurso: global = execucao + apoio, apoio <= teto
      - D aceita curva por faixa de meses
      - E aceita rateio sem coluna de solicitacoes
      - F confere a producao da parcela contra a faixa de unitarios, e os meses contra a vigencia
      - G aceita capacidade como | recurso | total | polo... |
      - H aceita derivados.quantitativo_exames
      - N ganhou verificar_N_multi: raiz do codigo na portaria, verificador entre plano e estado,
        e cada par valor de tabela + incremento na fonte

