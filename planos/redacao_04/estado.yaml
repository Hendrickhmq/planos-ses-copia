v23_20261008:
  base: "versoes/plano_v22_20261007.docx - aplicada por calculo_v23/aplicar_v23.py; numeros, quadros e riscos iguais aos da v22"
  pedido: "adequacao das salas de tomografia e ultrassom (sala baritada, rede eletrica) - o usuario pediu para ver o
    que o IEV escreveu e pesquisar a norma"
  achados:
    iev: "os dois aprovados do IEV com ultrassom (pt_ses_02, Projeto DOA; pt_ses_04, Projeto Fila Zero, que tem
      tambem 539 tomografias) nao falam de sala baritada, blindagem nem rede eletrica: so estrutura geral da unidade
      (item 1.2.1 da planilha: recepcao, sanitarios com um adaptado, agua potavel, iluminacao, climatizacao,
      acessibilidade) e 'designacao formal de RT' com 'proteção radiológica, controle de qualidade e segurança'"
    norma: "RDC Anvisa 611/2022 (arts. 7 e 8 projeto de blindagem aprovado pela vigilancia sanitaria; 51 a 54
      barreiras, sinalizacao e sala de comando; art. 8, par. unico: ultrassonografia dispensada); IN Anvisa 93/2021,
      Anexo I (levantamento radiometrico no teste de aceitacao, quadrienal e apos modificacao); RDC Anvisa 50/2002,
      itens 4.2.5.c e 4.2.5.d (sala de comando, eletrica diferenciada e de emergencia, climatizacao; sanitario anexo
      a sala de ultrassonografia de abdome). PDFs em normas/, registrados como NM-087 a NM-089 (eram NM-032 a NM-034 no ramo; renumerados na consolidação de 08/10/2026)"
    prazo_e_custeio: "sala nova de tomografia nao cabe em 8 meses (aprovacao do projeto, obra, aceitacao, vistoria e
      licenca); e obra ou reforma segue outro regime (Portaria GM/MS 10.297/2026, art. 8, I). Os polos com tomografia
      tem de ser estabelecimentos com sala ja licenciada; a estrutura fica na capacidade instalada"
  decisao_usuario: "seguir a sugestao da colega da equipe ('nao entrarmos muito nessas questoes no Plano de trabalho,
    para que nao gere alguma obrigacao de obra/execucao'): alinea de conformidade com a IN 93 e a RDC 50, 'no que
    couber a cada modalidade', e projeto de blindagem e levantamento radiometrico apresentados na formalizacao, com a
    licenca sanitaria. Eu sugeri manter os dois documentos no polo, a disposicao da fiscalizacao (a licenca ja
    pressupoe os dois); o usuario escolheu a formalizacao"
  ajuste_meu: "'dos polos com tomografia', e nao 'de cada polo': o servico de ultrassonografia nao tem projeto de blindagem"
  texto:
    alinea_b: "licença sanitária de cada polo e, nos polos com tomografia, projeto de blindagem aprovado pela vigilância
      sanitária e laudo de levantamento radiométrico, a apresentar na formalização do instrumento;"
    alinea_h: "conformidade dos tomógrafos com a Instrução Normativa Anvisa nº 93, de 27 de maio de 2021, e da estrutura
      física de cada polo com a RDC Anvisa nº 50, de 21 de fevereiro de 2002, no que couber a cada modalidade."
  conferencia: "17/22, iguais a v22 (J, M e Q herdados); plano 3 em 22/22 e 27/27; sumario sem mudanca de pagina (33)"
  ferramentas: "calculo_v23/ (aplicar_v23.py, gerar_v23.sh); usa docxlib e sumario de calculo_v20/"
