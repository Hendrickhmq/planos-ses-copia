      do medico que laudou, e liberar em sistema nao a substitui). Risco na matriz ficou so como sugestao em
      comentario - NAO entrou no texto"
    tolerancia: "sai a faixa de 10% e a frase de 'encerrada nao conta como meta nao cumprida'"
    creatinina: "exigida so do usuario com doenca renal preexistente (criterio da equipe, igual ao do municipio
      dela). Aceita quando valida - TrakCare, unidade solicitante ou trazida pelo usuario. Renal sem dosagem valida
      e regulado para a versao SEM contraste (061, 109, 053 - mesmo codigo SIGTAP e mesmo valor, conferido no
      SIGTAP 08/2026 e no Anexo I da 4.282), fluxo a pactuar com o Complexo Regulador no mes 1. Angiotomografia de
      coronarias nao tem versao sem contraste e exige a dosagem. Se chegar sem dosagem, o radiologista decide."
    rqe: "mantido como a equipe escreveu - decisao do usuario"
    cpf: "mantido - os 11 codigos tem atributo 058 'Obrigatorio CPF' no SIGTAP 08/2026 (fecha o Lastro 2 do em_aberto)"
