conferencia:
  conferir_plano: "20 PASSOU, 2 NAO SE APLICA (I fila externa, V ficha dispensada), 0 FALHOU - 17/09/2026"
  testar_conferencia_plano: "26/26 erros injetados apanhados pela verificacao certa (3 nao se aplicam) - 17/09/2026"
  notebooklm: |
    RODADA em 17/09/2026. Caderno 43cb54d7-b942-4a57-8dfb-d49657031abb, 18 fontes.
    C1 contradicao e lastro · C2 inventario dos aprovados (source_ids restritos aos cinco)
    C3 faturamento, reformulada porque as normas da versao original sao de OCI
    C4 execucao e risco.
    APLICADO, apos verificacao na fonte primaria:
      - o incremento da 4.282 opera no Componente Creditos Financeiros, cujo mecanismo e
        compensacao tributaria. A 3.3, a 3.6 e a 9.1 passam a trata-lo como PARAMETRO de
        custo unitario, nao como forma de remuneracao deste convenio. Era o achado central.
      - CPF: a 2.723/2025 excetua os povos originarios, identificados por CNS. 5.4 e 5.11.
      - prestacao de contas final: Decreto DF 48.727/2026 art. 26 §2º da 60 dias apos a
        vigencia. A Meta 6, a Etapa 3 e a 7.3 comprimiam isso para dentro dos 12 meses.
      - R-14: recomposicao de quantitativo exige termo aditivo, nao mera comunicacao.
      - R-16 novo: pactuacao interfederativa condiciona a execucao financeira (10.297/2026 art. 10).
      - R-17 novo: glosa por leitura de taxa de administracao ou de subcontratacao de funcao
        de gestao (Decreto 48.727/2026 arts. 17 IV e 33 §3º).
    REJEITADO como confusao com OCI: Nucleo de Gestao do Cuidado, financiamento FAEC do
    grupo 09, consulta de entrada obrigatoria, habilitacao 38.05, 5º digito 9 da APAC,
    atributos 065 e 0013, lancamento obrigatorio do secundario de contraste. Nada disso
    alcanca exame avulso dos grupos 02.05 e 02.06 fora do Componente Creditos Financeiros.
    REJEITADO como decisao travada: divergencia dos quantitativos contra o painel de 15/09
    e a data da extracao — a planilha de 10/09 prevalece por decisao do usuario.
    REJEITADO por fonte ausente do caderno: angiotomografia sob 02.06.02.003-1 — o lastro e
    o campo codigo_sigtap_solicitacao do painel, em dados/fontes/mapa_social_tomografia.md.
    EM ABERTO: os cinco aprovados trazem coluna de responsavel na matriz de riscos; a nossa
    nao tem, embora a 8.1 prometa mitigacao atribuida a responsavel determinado.
  regressao_plano_3: "22/22 e 27/27 - a adaptacao multi-codigo nao afrouxou nada"
  bugs_encontrados_na_ferramenta: |
    A segunda conferencia apanhou quatro defeitos que estavam na ferramenta desde antes
    deste plano, e um deles calava uma verificacao inteira:
      - radical(): cortava "es" antes de "s", entao "exames" virava "exam" e "exame"
        continuava "exame". A R.2 nao conferia UMA quantidade sequer neste plano.
      - itens_de_planilha(): descartava a linha cujo nome contem "total" — a
        ULTRASSONOGRAFIA DE ABDOMEN TOTAL sumia da planilha lida.
      - verificar_T(): o padrao de unidade "minutos?|min\b" entrava sem parenteses na
        busca de lastro, e a alternancia quebrava a ancora: qualquer "min" no corpus
        dava lastro a qualquer numero em minutos.
      - verificar_T(): o corpus juntava arquivos com "\n", e a janela de separadores
        atravessava a juncao, fabricando lastro entre o fim de um arquivo e o inicio
        do seguinte.
    Tambem: "meses" nao era unidade da T, e a P aceitava qualquer mencao a "meta
    qualitativa" em vez da declaracao.
  achados_no_plano: |
    Com a T corrigida, ela apanhou quatro premissas sem fonte publicadas no documento —
    os intervalos de agendamento de 20, 30 e 15 minutos e o "vinte ou trinta minutos"
    do R-02. Sairam do plano em 17/09/2026 pela regra 1; a derivacao ficou em
    dados/capacidade.md.
  ferramenta_adaptada: |
    conferir_plano.py ganhou modo de multiplos codigos em 17/09/2026, guardado para nao
    alterar o plano 3 (que segue em 22/22 e 27/27 no harness):
      - carregar_parametros le valor_unitario.por_codigo, metas_execucao e direcao
      - etapas_da_planilha fecha etapa tambem no TOTAL DA META
      - metas_planilha le linha a linha e toma o ultimo valor monetario
      - B confere as metas de execucao pela soma das etapas
      - C inverte quando direcao = fila_define_recurso: global = execucao + apoio, apoio <= teto
      - D aceita curva por faixa de meses
      - E aceita rateio sem coluna de solicitacoes
      - F confere a producao da parcela contra a faixa de unitarios, e os meses contra a vigencia
      - G aceita capacidade como | recurso | total | polo... |
      - H aceita derivados.quantitativo_exames
      - N ganhou verificar_N_multi: raiz do codigo na portaria, verificador entre plano e estado,
        e cada par valor de tabela + incremento na fonte

